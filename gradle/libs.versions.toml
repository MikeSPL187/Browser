[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-multiplatform = "1.12.1"
# Keep GeckoView on the latest stable release: it carries the engine's security fixes.
geckoview = "156.0.20260921121718"
compose-bom = "2026.09.00"
compose-material3 = "1.5.0-alpha29"
lifecycle = "2.8.7"
# GeckoView resolves Media3 core at this version; keep the session API aligned with it.
media3 = "1.11.1"
kotlinx-serialization = "1.11.0"

[libraries]
geckoview = { module = "org.mozilla.geckoview:geckoview", version.ref = "geckoview" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-biometric = { module = "androidx.biometric:biometric", version = "1.1.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-credentials = { module = "androidx.credentials:credentials", version = "1.5.0" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version = "1.9.1" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.2.0" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.16.0" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version = "2.12.0" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

guava = { module = "com.google.guava:guava", version = "33.7.1-android" }
blurview = { module = "com.github.Dimezis:BlurView", version = "version-3.2.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version = "1.6.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

junit = { module = "junit:junit", version = "4.13.2" }
json = { module = "org.json:json", version = "20260814" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
