# Keeps gradle/libs.versions.toml and the pinned GitHub Actions current. Every update arrives as a
# pull request that goes through .github/workflows/build.yml before it can be merged.
version: 2

registries:
  google:
    type: maven-repository
    url: https://dl.google.com/dl/android/maven2/
  mozilla:
    type: maven-repository
    url: https://maven.mozilla.org/maven2/
  jitpack:
    type: maven-repository
    url: https://jitpack.io

updates:
  - package-ecosystem: gradle
    directory: /
    registries:
      - google
      - mozilla
      - jitpack
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # GeckoView comes from .github/workflows/geckoview-update.yml: daily, so security dot
      # releases land within 48 hours, with the release links and the phone checklist.
      - dependency-name: "org.mozilla.geckoview:*"
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      kotlin-and-build:
        patterns:
          - com.android.*
          - org.jetbrains.kotlin*
          - org.jetbrains.compose*
      androidx:
        patterns:
          - androidx.*
      other:
        patterns:
          - "*"
        exclude-patterns:
          - com.android.*
          - org.jetbrains.kotlin*
          - org.jetbrains.compose*
          - androidx.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
