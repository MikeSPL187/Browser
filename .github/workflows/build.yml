# Vola CI: the single source of truth for builds.
#
# - Every pull request and push to main: script tests, a no-Google-Play-services dependency
#   policy check, unit tests (GeckoView and System WebView flavors), Android lint, and
#   installable, optimized arm64 preview APKs.
# - Tags v*, or a manual run on main with "release" enabled: the same checks, then signed
#   release APKs published as a GitHub Release (the manual run also creates the tag).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   VOLA_PREVIEW_KEYSTORE_BASE64   optional, stable key for preview APKs so they install over each other
#   VOLA_RELEASE_KEYSTORE_BASE64   required for tags
#   VOLA_RELEASE_STORE_PASSWORD    required for tags
#   VOLA_RELEASE_KEY_ALIAS         required for tags
#   VOLA_RELEASE_KEY_PASSWORD      required for tags
# Variables:
#   VOLA_RELEASE_CERTIFICATE_SHA256  recommended, pins the release certificate fingerprint

name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: Publish a signed release for the version in gradle.properties (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ANDROID_PLATFORM: "platforms;android-37.1"
  RELEASE_ABI: arm64-v8a

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The quality gates diff a pull request against its base: the merge commit's first parent.
          fetch-depth: 2

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "$ANDROID_PLATFORM"

      - name: Script tests
        run: |
          for test in scripts/test_compile_*.py scripts/test_generate_gecko_default_extensions.py \
            scripts/test_translations.py scripts/test_geckoview_latest.py \
            scripts/test_quality_gates.py; do
            echo "::group::${test}"
            python3 "$test"
            echo "::endgroup::"
          done
          python3 scripts/generate_gecko_default_extensions.py verify
          node --test scripts/*.test.mjs

      # docs/vola/ROADMAP.md, section 4: what a machine can check, it checks on every pull request.
      - name: Quality gates
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Run every gate, then fail once, so one finding does not hide the others.
          status=0
          gates=(size engine brand)
          if [ "$EVENT_NAME" = pull_request ]; then
            gates+=("tokens --base HEAD^1")
          fi
          for gate in "${gates[@]}"; do
            # shellcheck disable=SC2086 # the gate carries its own arguments
            python3 scripts/ci/quality_gates.py $gate || status=1
          done
          exit "$status"

      - name: Dependency policy
        run: ./gradlew --no-daemon --stacktrace verifyNoPlayServicesDependencies

      - name: Unit tests
        run: >-
          ./gradlew --no-daemon --stacktrace
          testFullDebugUnitTest
          testSystemwebviewDebugUnitTest
          :shared:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace lintFullDebug

      # Gradle prints only the first lint error. List all of them so the job log alone is enough
      # to fix a red build (report artifacts are hard to open from a phone).
      - name: Show lint errors
        if: ${{ failure() }}
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/fullDebug/lintReportFullDebug/lint-results-fullDebug.txt
          if [[ -f "$report" ]]; then
            grep -E -A2 ': Error: ' "$report" || true
          fi

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            shared/build/reports/
            shared/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  preview-apk:
    name: Preview APKs (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "$ANDROID_PLATFORM"

      # Preview (localRelease) builds are signed with $ANDROID_USER_HOME/debug.keystore (alias
      # androiddebugkey, passwords "android"). Restoring a stable one lets each new APK update the
      # previous install instead of requiring an uninstall that wipes browser data.
      - name: Restore preview signing key
        env:
          VOLA_PREVIEW_KEYSTORE_BASE64: ${{ secrets.VOLA_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${VOLA_PREVIEW_KEYSTORE_BASE64:-}" ]]; then
            echo "::notice title=Preview signing::VOLA_PREVIEW_KEYSTORE_BASE64 is not set. Preview APKs use a throwaway key and cannot be installed over each other."
            exit 0
          fi
          android_user_home="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$android_user_home"
          keystore="$android_user_home/debug.keystore"
          printf '%s' "$VOLA_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass android -alias androiddebugkey > /dev/null

      # Optimized like a release (R8, compressed native libraries) so previews show real size and
      # speed, but installed as the separate "Vola Preview" app.
      - name: Build preview APKs
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
          -Pvola.releaseAbi="$RELEASE_ABI"
          -Pvola.compressNativeLibs=true
          assembleFullLocalRelease
          assembleSystemwebviewLocalRelease

      - name: Collect APKs
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist/gecko dist/systemwebview
          cp app/build/outputs/apk/full/localRelease/app-full-localRelease.apk \
            "dist/gecko/Vola-${short_sha}-gecko-${RELEASE_ABI}-preview.apk"
          cp app/build/outputs/apk/systemwebview/localRelease/app-systemwebview-localRelease.apk \
            "dist/systemwebview/Vola-${short_sha}-systemwebview-preview.apk"
          aapt2="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 | sort -V | tail -n 1)"
          {
            echo "### Preview APKs"
            echo
            echo "| APK | Size | Package | Native code | SHA-256 |"
            echo "| --- | ---: | --- | --- | --- |"
            for apk in dist/*/*.apk; do
              badging="$("$aapt2" dump badging "$apk")"
              package="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$badging")"
              abis="$(sed -nE 's/^native-code: (.*)$/\1/p' <<< "$badging" | tr -d "'")"
              size="$(du -h "$apk" | cut -f1)"
              digest="$(sha256sum "$apk" | cut -d ' ' -f1)"
              echo "| $(basename "$apk") | ${size} | \`${package}\` | ${abis:-none} | \`${digest::16}…\` |"
            done
            echo
            echo "Download them from the **Artifacts** section of this run."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload GeckoView APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vola-gecko-preview-${{ github.run_number }}
          path: dist/gecko/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload System WebView APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vola-webview-preview-${{ github.run_number }}
          path: dist/systemwebview/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main') }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          project_version="$(sed -n 's/^vola\.versionName=//p' gradle.properties)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${project_version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release ${tag} already exists. Bump vola.versionName in gradle.properties." >&2
              exit 1
            fi
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${tag} must look like v0.2, v1.0.0 or v1.0.0-rc.1." >&2
            exit 1
          fi
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag ${tag} does not match versionName ${project_version} in gradle.properties." >&2
            exit 1
          fi
          notes="release-notes/${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes ${notes} are missing." >&2
            exit 1
          fi
          {
            echo "RELEASE_TAG=${tag}"
            echo "RELEASE_VERSION=${version}"
            echo "RELEASE_NOTES=${notes}"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "$ANDROID_PLATFORM"

      - name: Restore release keystore
        env:
          VOLA_RELEASE_KEYSTORE_BASE64: ${{ secrets.VOLA_RELEASE_KEYSTORE_BASE64 }}
          VOLA_RELEASE_STORE_PASSWORD: ${{ secrets.VOLA_RELEASE_STORE_PASSWORD }}
          VOLA_RELEASE_KEY_ALIAS: ${{ secrets.VOLA_RELEASE_KEY_ALIAS }}
          VOLA_RELEASE_KEY_PASSWORD: ${{ secrets.VOLA_RELEASE_KEY_PASSWORD }}
          VOLA_RELEASE_CERTIFICATE_SHA256: ${{ vars.VOLA_RELEASE_CERTIFICATE_SHA256 }}
        run: |
          for variable in VOLA_RELEASE_KEYSTORE_BASE64 VOLA_RELEASE_STORE_PASSWORD \
            VOLA_RELEASE_KEY_ALIAS VOLA_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing release secret: ${variable}" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/vola-release.jks"
          printf '%s' "$VOLA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass:env VOLA_RELEASE_STORE_PASSWORD \
            -alias "$VOLA_RELEASE_KEY_ALIAS" > /dev/null

          actual_certificate="$(
            keytool -exportcert -keystore "$keystore" -storepass:env VOLA_RELEASE_STORE_PASSWORD \
              -alias "$VOLA_RELEASE_KEY_ALIAS" | sha256sum | cut -d ' ' -f1
          )"
          if [[ -n "${VOLA_RELEASE_CERTIFICATE_SHA256:-}" ]]; then
            expected_certificate="${VOLA_RELEASE_CERTIFICATE_SHA256//:/}"
            expected_certificate="${expected_certificate,,}"
            if [[ "$actual_certificate" != "$expected_certificate" ]]; then
              echo "Release keystore certificate does not match VOLA_RELEASE_CERTIFICATE_SHA256." >&2
              exit 1
            fi
          else
            echo "::warning title=Release signing::Set the repository variable VOLA_RELEASE_CERTIFICATE_SHA256=${actual_certificate} to pin the release certificate."
          fi

          # app/build.gradle.kts reads these names.
          {
            echo "VOLA_RELEASE_KEYSTORE_PATH=${keystore}"
            echo "EXPECTED_CERTIFICATE=${actual_certificate}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          VOLA_RELEASE_STORE_PASSWORD: ${{ secrets.VOLA_RELEASE_STORE_PASSWORD }}
          VOLA_RELEASE_KEY_ALIAS: ${{ secrets.VOLA_RELEASE_KEY_ALIAS }}
          VOLA_RELEASE_KEY_PASSWORD: ${{ secrets.VOLA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=1
          -Pvola.releaseAbi="$RELEASE_ABI"
          -Pvola.compressNativeLibs=true
          assembleFullRelease
          assembleSystemwebviewRelease

      - name: Verify and checksum APKs
        run: |
          mkdir -p dist
          gecko_apk="dist/Vola-${RELEASE_TAG}-${RELEASE_ABI}-release.apk"
          webview_apk="dist/Vola-${RELEASE_TAG}-systemwebview-release.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "$gecko_apk"
          cp app/build/outputs/apk/systemwebview/release/app-systemwebview-release.apk "$webview_apk"

          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -n 1)"
          for apk in "$gecko_apk" "$webview_apk"; do
            verification="$("$apksigner" verify --verbose --print-certs "$apk")"
            actual_certificate="$(
              printf '%s\n' "$verification" \
                | sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]:]+)$/\1/p' \
                | tr '[:upper:]' '[:lower:]' | tr -d ':' | sort -u
            )"
            if [[ "$actual_certificate" != "$EXPECTED_CERTIFICATE" ]]; then
              echo "${apk} is not signed with the release certificate." >&2
              exit 1
            fi
            "$zipalign" -c -P 16 4 "$apk"
            (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Vola ${RELEASE_TAG}" --notes-file "$RELEASE_NOTES")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}"

      - name: Remove release keystore
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/vola-release.jks"
