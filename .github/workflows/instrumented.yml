# Instrumented tests (app/src/androidTest) on an Android emulator, split into shards.
#
# Runs for pull requests labelled "instrumented", every night on main, and on manual dispatch
# (optionally for one package or class). Each test runs in its own process through the AndroidX
# Test Orchestrator with cleared app data. The "Report" job merges the shards, writes the summary
# to the run page and fails on any failing test that scripts/ci/instrumented-baseline.txt does not
# list. See docs/vola/ci-instrumented-tests.md.

name: Instrumented tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: >-
          Package (dev.sk2andy.materialbrowser.ui) or class, optionally #method; several classes
          separated by commas. Empty runs everything.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ANDROID_SERIAL: emulator-5554
  SHARDS: 4

jobs:
  android-test:
    name: Shard ${{ matrix.shard }}
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'instrumented') &&
      (github.event.action != 'labeled' || github.event.label.name == 'instrumented')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install emulator and system image
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/vola-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          # The SDK mirror sometimes cuts a download short: drop the partial file and retry.
          for attempt in 1 2 3; do
            if sdkmanager \
              "emulator" \
              "platform-tools" \
              "platforms;android-37.1" \
              "system-images;android-35;google_apis;x86_64"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "sdkmanager failed (attempt $attempt), retrying"
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep $((attempt * 15))
          done
          printf 'no\n' | avdmanager create avd \
            --force \
            --name vola_test \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Start emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd vola_test \
            -port 5554 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

      # Compiles while the emulator boots.
      - name: Build app and test APKs
        run: |
          ./gradlew --no-daemon --stacktrace assembleFullDebug assembleFullDebugAndroidTest
          # The Kotlin compile daemon outlives the build; free its memory for the emulator.
          pkill -f KotlinCompileDaemon || true

      - name: Wait for emulator
        run: |
          timeout 300 adb wait-for-device
          # shellcheck disable=SC2016 # expanded by the inner shell
          timeout 300 bash -c '
            until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb shell settings put global hide_error_dialogs 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82

      - name: Run tests
        env:
          FILTER: ${{ github.event.inputs.filter }}
          SHARD: ${{ matrix.shard }}
        run: |
          # timeout_msec: a hanging test fails after two minutes instead of holding the shard
          # until the job times out, which would lose the results of every test in it.
          args=(
            -Pandroid.testInstrumentationRunnerArguments.clearPackageData=true
            -Pandroid.testInstrumentationRunnerArguments.timeout_msec=120000
            -Pandroid.testInstrumentationRunnerArguments.numShards="$SHARDS"
            -Pandroid.testInstrumentationRunnerArguments.shardIndex="$SHARD"
          )
          if [[ -n "$FILTER" ]]; then
            if [[ "$FILTER" =~ ^[a-z0-9_.]+$ ]]; then
              args+=(-Pandroid.testInstrumentationRunnerArguments.package="$FILTER")
            else
              args+=(-Pandroid.testInstrumentationRunnerArguments.class="$FILTER")
            fi
          fi
          adb logcat -c || true
          nohup adb logcat -v threadtime > "$RUNNER_TEMP/logcat.txt" 2>&1 &
          # Gradle prints nothing until the shard ends. Show each test as it starts and ends, and
          # the runner's memory and disk, so a shard that dies still says where and why.
          adb logcat -v brief -s TestRunner:I | grep --line-buffered -E 'started|failed|finished' &
          progress=$!
          while sleep 300; do
            echo "[monitor] $(free -m | awk '/Mem/ {print "mem used " $3 " of " $2 " MB"}');" \
              "$(df -h / | awk 'NR==2 {print "disk free " $4}')"
          done &
          monitor=$!
          started=$(date +%s)
          # Failing tests are judged by the Report job against the baseline; this step fails only
          # when the shard produced no results at all.
          ./gradlew --no-daemon --stacktrace connectedFullDebugAndroidTest "${args[@]}" || true
          kill "$progress" "$monitor" 2>/dev/null || true
          pkill -f "logcat -v brief" || true
          pkill -x -f "sleep 300" || true
          echo "Shard $SHARD took $(( ($(date +%s) - started) / 60 )) min."
          if [[ -z "$(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null)" ]]; then
            echo "::error::Shard $SHARD produced no test results."
            exit 1
          fi

      - name: Collect results
        if: ${{ always() }}
        run: |
          out="$RUNNER_TEMP/shard-${{ matrix.shard }}"
          mkdir -p "$out"
          cp -r app/build/outputs/androidTest-results "$out/results" 2>/dev/null || true
          cp -r app/build/reports/androidTests "$out/report" 2>/dev/null || true
          pkill -f "adb logcat" || true
          gzip -c "$RUNNER_TEMP/logcat.txt" > "$out/logcat.txt.gz" 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" "$out/" 2>/dev/null || true

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn

  report:
    name: Report
    needs: android-test
    if: ${{ !cancelled() && needs.android-test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Script tests
        run: python3 scripts/ci/test_instrumented_summary.py

      # A shard that uploaded nothing keeps an empty directory, which the summary reports.
      - name: Download shard results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'instrumented-shard-*' --dir "$RUNNER_TEMP/shards" || true
          for shard in $(seq 0 $((SHARDS - 1))); do
            mkdir -p "$RUNNER_TEMP/shards/instrumented-shard-$shard"
          done

      - name: Summary
        run: |
          shards=()
          for shard in $(seq 0 $((SHARDS - 1))); do
            shards+=("$RUNNER_TEMP/shards/instrumented-shard-$shard")
          done
          python3 scripts/ci/instrumented_summary.py "${shards[@]}" \
            --baseline scripts/ci/instrumented-baseline.txt \
            --failures "$RUNNER_TEMP/failing-tests.txt" \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload failing test list
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-failing-tests
          path: ${{ runner.temp }}/failing-tests.txt
          retention-days: 14
          if-no-files-found: ignore
