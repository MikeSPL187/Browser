# Performance budget (docs/vola/plan-v5.md, section 7, V2 and V3): cold start, frame CPU time and
# memory of a pull request against its base, both built in this run and measured on the same
# emulator in alternating turns, so a drift in the runner's speed hits both builds alike.
# scripts/ci/perf_gate.py and memory_budget.py fail the job only on a clear regression; the owner's
# "perf-approved" label lets a known one through (add it, then re-run the job). Emulator numbers
# compare builds; smoothness is judged on a phone.

name: Performance budget

on:
  pull_request:
    paths:
      - "app/**"
      - "shared/**"
      - "baselineprofile/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/performance.yml"
      - "scripts/ci/perf_gate.py"
      - "scripts/ci/memory_budget.py"
      - "scripts/ci/gecko_memory_report.py"
      - "scripts/ci/pages/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the perf-approved label at the time of the run

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ANDROID_SERIAL: emulator-5554
  APP_PACKAGE: io.github.mikespl187.vola.benchmark
  BENCHMARKS: >-
    dev.sk2andy.materialbrowser.baselineprofile.StartupBenchmark#coldStartWithProfileIfBundled,dev.sk2andy.materialbrowser.baselineprofile.ScrollJankBenchmark
  PAGE_PORT: "8765"

jobs:
  budget:
    name: Cold start and frames
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base is HEAD^1: for a pull request, the base branch the merge commit sits on.
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install emulator and system image
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/vola-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          # The SDK mirror sometimes cuts a download short ("Error reading Zip content"):
          # drop the partial file and try again before failing the job.
          for attempt in 1 2 3; do
            if sdkmanager \
              "emulator" \
              "platform-tools" \
              "platforms;android-37.2" \
              "system-images;android-35;google_apis;x86_64"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "sdkmanager failed (attempt $attempt), retrying"
            rm -rf "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            sleep $((attempt * 15))
          done
          printf 'no\n' | avdmanager create avd \
            --force \
            --name vola_ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_6
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Build this pull request
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" \
            :app:assembleFullBenchmark :baselineprofile:assembleFullBenchmark
          mkdir -p perf
          cp app/build/outputs/apk/full/benchmark/app-full-benchmark.apk perf/head.apk
          cp "$(find baselineprofile/build/outputs/apk -name '*.apk' | head -n 1)" perf/benchmarks.apk

      - name: Build the base
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" \
            :app:assembleFullBenchmark
          cp app/build/outputs/apk/full/benchmark/app-full-benchmark.apk "$GITHUB_WORKSPACE/perf/base.apk"

      # The emulator died mid-benchmark on PR #622 (base and head alike, no trace in its log):
      # the builds' Kotlin and Gradle daemons stay alive and hold gigabytes. They go before the
      # emulator starts, and swap gives headroom, as in instrumented.yml.
      - name: Free memory for the emulator
        run: |
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          sudo fallocate -l 8G /vola-swap
          sudo chmod 600 /vola-swap
          sudo mkswap /vola-swap > /dev/null
          sudo swapon /vola-swap
          free -m

      - name: Start emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd vola_ci \
            -port 5554 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          # shellcheck disable=SC2016 # expanded by the inner shell
          timeout 300 bash -c '
            until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb shell settings put global hide_error_dialogs 1
          adb shell input keyevent 82

      - name: Measure base and pull request in turns
        run: |
          # The scroll page, served on the host and reached as http://localhost on the emulator.
          nohup python3 -m http.server "$PAGE_PORT" --bind 127.0.0.1 --directory scripts/ci/pages \
            > "$RUNNER_TEMP/pages.log" 2>&1 &
          adb reverse "tcp:$PAGE_PORT" "tcp:$PAGE_PORT"

          aapt2="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt2 | sort -V | tail -n 1)"
          test_package="$("$aapt2" dump packagename perf/benchmarks.apk)"
          adb install -r -t perf/benchmarks.apk
          runner="$(adb shell pm list instrumentation | tr -d '\r' |
            sed -nE "s/^instrumentation:${test_package}\/([^ ]+) .*/\1/p" | head -n 1)"
          device_output="/sdcard/Android/media/${test_package}/additional_test_output"

          # Alternating turns: a drift in the emulator's speed hits both builds alike.
          for turn in base:1 head:1 head:2 base:2 base:3 head:3; do
            build="${turn%%:*}"
            round="${turn##*:}"
            echo "::group::${build}, round ${round}"
            adb uninstall "$APP_PACKAGE" > /dev/null 2>&1 || true
            adb install "perf/${build}.apk"
            # A round whose instrumentation ends without a result (adb lost the emulator for a
            # moment: exit 255 and no INSTRUMENTATION_CODE, PR #622) is run once more instead of
            # ending the whole job.
            for attempt in 1 2; do
              adb wait-for-device
              adb shell rm -rf "$device_output"
              adb shell mkdir -p "$device_output"
              adb shell am instrument -w -r \
                -e class "$BENCHMARKS" \
                -e androidx.benchmark.suppressErrors EMULATOR \
                -e additionalTestOutputDir "$device_output" \
                "${test_package}/${runner}" | tee "perf/${build}-${round}.log" || true
              if grep -q "INSTRUMENTATION_CODE" "perf/${build}-${round}.log"; then break; fi
              if [[ "$attempt" == 2 ]]; then
                echo "::error title=Performance budget::${build} round ${round} ended twice without a result"
                exit 1
              fi
              echo "::warning title=Performance budget::${build} round ${round} ended without a result; running it again"
              free -m
              if ! timeout 60 adb wait-for-device; then
                # The emulator itself is gone: start it again, cold, as the step above did.
                nohup "$ANDROID_HOME/emulator/emulator" -avd vola_ci -port 5554 -no-window -noaudio \
                  -no-boot-anim -gpu swiftshader_indirect >> "$RUNNER_TEMP/emulator.log" 2>&1 &
                timeout 300 adb wait-for-device
                # shellcheck disable=SC2016 # expanded by the inner shell
                timeout 300 bash -c '
                  until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done
                '
                adb shell settings put global hide_error_dialogs 1
                adb reverse "tcp:$PAGE_PORT" "tcp:$PAGE_PORT"
                adb install -r -t perf/benchmarks.apk
              fi
              adb uninstall "$APP_PACKAGE" > /dev/null 2>&1 || true
              adb install "perf/${build}.apk"
            done
            if grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "perf/${build}-${round}.log"; then
              echo "::warning title=Performance budget::${build} round ${round} had a failing benchmark (see its log group)"
            fi
            mkdir -p "perf/results/${build}/${round}"
            adb pull "$device_output/." "perf/results/${build}/${round}/" > /dev/null || true
            echo "::endgroup::"
          done

      # docs/vola/plan-v5.md, V3: memory with one page open, and what each further tab adds. Three
      # rounds a build, compared by their median (memory_budget.py, calibration in its docstring).
      - name: Measure memory in turns
        run: |
          for turn in base:1 head:1 head:2 base:2 base:3 head:3; do
            build="${turn%%:*}"
            round="${turn##*:}"
            echo "::group::memory, ${build}, round ${round}"
            adb uninstall "$APP_PACKAGE" > /dev/null 2>&1 || true
            adb install "perf/${build}.apk"
            python3 scripts/ci/memory_budget.py measure --package "$APP_PACKAGE" \
              --url "http://localhost:${PAGE_PORT}/scroll.html" \
              --out "perf/memory/${build}-${round}.json" ||
              echo "::warning title=Memory budget::${build} round ${round} was not measured"
            echo "::endgroup::"
          done

      # What Gecko's own memory is made of (about:memory), base and this pull request: dumpsys sees
      # most of the main process as «Unknown». Information only; it never fails the job.
      - name: Gecko memory report
        run: |
          for build in base head; do
            adb uninstall "$APP_PACKAGE" > /dev/null 2>&1 || true
            adb install "perf/${build}.apk" > /dev/null
            adb shell am start -W -a android.intent.action.VIEW \
              -d "http://localhost:${PAGE_PORT}/scroll.html?tab=0" -p "$APP_PACKAGE" > /dev/null
            sleep 20
            python3 scripts/ci/gecko_memory_report.py capture --package "$APP_PACKAGE" \
              --out "perf/memory/gecko-${build}.json.gz" || true
            {
              echo "#### ${build}"
              python3 scripts/ci/gecko_memory_report.py summarize "perf/memory/gecko-${build}.json.gz" || true
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # The full table in the log too: Actions summaries are not readable through the API.
          for build in base head; do
            echo "::group::Gecko memory report, ${build}"
            python3 scripts/ci/gecko_memory_report.py summarize "perf/memory/gecko-${build}.json.gz" --top 30 || true
            echo "::endgroup::"
          done

      - name: Performance budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          options=()
          # Read now rather than from the event, so adding the label and re-running this job is enough.
          if [ -n "$PR_NUMBER" ] &&
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name' | grep -qx perf-approved; then
            options+=(--approved)
          fi
          # Both budgets report before the job fails, so one does not hide the other.
          status=0
          python3 scripts/ci/perf_gate.py --base perf/results/base --head perf/results/head "${options[@]}" || status=1
          python3 scripts/ci/memory_budget.py compare \
            --base perf/memory/base-*.json --head perf/memory/head-*.json "${options[@]}" || status=1
          exit "$status"

      # Only the numbers: the traces Macrobenchmark leaves next to them weigh hundreds of megabytes.
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.run_number }}
          path: |
            perf/*.log
            perf/results/**/*benchmarkData.json
            perf/memory/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show emulator log after failure
        if: ${{ failure() }}
        run: sed -n '1,300p' "$RUNNER_TEMP/emulator.log" || true

      - name: Stop emulator
        if: ${{ always() }}
        run: adb emu kill || true
