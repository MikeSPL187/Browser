name: Nightly smoke

# The release build on an emulator, against the sites people open every day (scripts/ci/release_smoke.py).
# A crash keeps its symbolicated stack in the job log; the night's result goes to issue #134.
on:
  schedule:
    - cron: "23 0 * * *" # 03:23 Moscow time
  workflow_dispatch:
  pull_request: # a change to the smoke test proves itself on the PR
    paths:
      - .github/workflows/nightly-smoke.yml
      - scripts/ci/release_smoke.py
      - scripts/ci/symbolicate.py

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-smoke
  cancel-in-progress: false

env:
  SMOKE_ISSUE: "134"
  SMOKE_PACKAGE: io.github.mikespl187.vola.preview # localRelease: vola.localReleaseApplicationIdSuffix
  ANDROID_SERIAL: emulator-5554

jobs:
  smoke:
    name: Release build on popular sites
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Add swap
        run: |
          sudo fallocate -l 8G /vola-swap
          sudo chmod 600 /vola-swap
          sudo mkswap /vola-swap > /dev/null
          sudo swapon /vola-swap

      - name: Install emulator and system image
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/vola-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sdkmanager "emulator" "platform-tools" "platforms;android-37.1" \
            "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd --force --name vola_smoke \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Start emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd vola_smoke -port 5554 -no-window -noaudio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Build the release APK
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
          assembleFullLocalRelease

      - name: Open the sites
        id: smoke
        env:
          SMOKE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ci/release_smoke.py
          --apk app/build/outputs/apk/full/localRelease/app-full-localRelease.apk
          --package "$SMOKE_PACKAGE"
          --report "$RUNNER_TEMP/smoke.md"
          --version "${SMOKE_SHA::7}"

      - name: Post the night's result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SMOKE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          report="$RUNNER_TEMP/smoke.md"
          if [ ! -s "$report" ]; then
            printf '## Ночной smoke-тест release · %s · ⚠️ не дошёл до сайтов (%s)\n' \
              "${SMOKE_SHA::7}" "$SMOKE_OUTCOME" > "$report"
          fi
          printf '\n[Лог прогона](%s)\n' "$RUN_URL" >> "$report"
          gh issue comment "$SMOKE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$report"

      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-smoke
          path: |
            ${{ runner.temp }}/smoke.md
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
