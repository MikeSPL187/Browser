# Keeps GeckoView on the latest stable release (CLAUDE.md rule 6, docs/vola/tech-plan.md section 3).
#
# Every day it reads the GeckoView release list on maven.mozilla.org. When a newer release is out,
# it pushes a branch that bumps gradle/libs.versions.toml, opens a pull request with the release
# links and the phone checklist, closes older GeckoView pull requests it supersedes, and starts the
# Build and Screenshots workflows for the branch: pull requests opened with GITHUB_TOKEN do not
# start workflows on their own.
#
# Daily rather than weekly because Mozilla ships security dot releases between majors and the plan
# is to take them within 48 hours. Pull requests that change this workflow or its script only run
# the check and print the versions.
#
# Opening pull requests needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests".

name: GeckoView update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/geckoview-update.yml
      - scripts/ci/geckoview_latest.py

permissions:
  contents: read

concurrency:
  group: geckoview-update-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    name: GeckoView release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the latest release
        id: release
        run: |
          python3 scripts/ci/geckoview_latest.py check | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
          UPDATE: ${{ steps.release.outputs.update }}
        run: |
          {
            echo "### GeckoView"
            echo "- In the catalog: \`${CURRENT}\`"
            echo "- Latest release: \`${LATEST}\`"
            echo "- Update needed: ${UPDATE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the update pull request
        if: >-
          ${{ github.event_name != 'pull_request' && steps.release.outputs.update == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
          DISPLAY_VERSION: ${{ steps.release.outputs.display }}
        run: |
          branch="geckoview/${LATEST}"
          existing="$(gh pr list --head "$branch" --state all --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Pull request #${existing} already covers GeckoView ${LATEST}."
            exit 0
          fi

          # A branch without a pull request means an earlier run pushed it but could not open the PR.
          if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            python3 scripts/ci/geckoview_latest.py apply "$LATEST"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git commit -am "build: GeckoView ${DISPLAY_VERSION}"
            git push origin "$branch"
          fi

          current_display="${CURRENT%.*}"
          body_file="$RUNNER_TEMP/geckoview-pr.md"
          cat > "$body_file" <<EOF
          Автоматическое обновление движка: GeckoView **${current_display} → ${DISPLAY_VERSION}** (\`${LATEST}\`).

          ## Что в выпуске
          - Заметки о выпуске Firefox для Android: https://www.mozilla.org/firefox/android/${DISPLAY_VERSION}/releasenotes/
          - Изменения API GeckoView: https://firefox-source-docs.mozilla.org/mobile/android/geckoview/consumer/geckoview-changelog.html
          - Бюллетени безопасности (MFSA): https://www.mozilla.org/security/known-vulnerabilities/firefox/

          Сборка в этом PR компилирует адаптер Gecko против новой версии; устаревшие API видны в
          предупреждениях сборки (\`w: … is deprecated\`).

          ## Сроки
          Точечные обновления безопасности — в течение 48 часов, мажорные — в течение недели.

          ## Чек-лист на телефоне (превью-APK из CI)
          1. Открыть 5 разных сайтов (новости, видео, магазин, вход в аккаунт, тяжёлое веб-приложение) — страницы грузятся и прокручиваются.
          2. Прокрутить страницу — панель сжимается в капсулу, карточка растёт, страница не прыгает.
          3. Видео: полноэкранный режим и картинка в картинке работают.
          4. Вход на сайт с паролем: предложение сохранить появляется, вход проходит.
          5. Приватная вкладка открывается и закрывается, после закрытия в истории ничего нет.
          6. uBlock Origin блокирует рекламу на любом новостном сайте.
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "build: GeckoView ${DISPLAY_VERSION}" \
            --body-file "$body_file" \
            --label screenshots \
            || {
              echo "::error::Could not open the pull request. Enable Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests, then re-run this workflow."
              exit 1
            }
          number="$(gh pr list --head "$branch" --json number --jq '.[0].number')"

          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("geckoview/")) | .number' |
            while read -r older; do
              if [ "$older" != "$number" ]; then
                gh pr close "$older" --delete-branch --comment "Заменён на #${number} (GeckoView ${DISPLAY_VERSION})."
              fi
            done

          gh workflow run build.yml --ref "$branch"
          gh workflow run screenshots.yml --ref "$branch"
          echo "- Opened #${number}" >> "$GITHUB_STEP_SUMMARY"
