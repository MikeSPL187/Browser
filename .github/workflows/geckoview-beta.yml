# Builds Vola against the newest GeckoView beta every night (docs/vola/research/engine-modernization.md,
# section 2.7), so an API change or a new Google Play services call shows up about four weeks before
# the release reaches the stable channel and geckoview-update.yml.
#
# Nothing is committed: the job switches the catalog to the geckoview-beta artifact in its own
# checkout, compiles the Gecko build and runs its unit tests, among them GeckoPlayServicesReferenceTest
# and GeckoWebAuthnFallbackTest, which catch the Play services calls that once crashed Gecko (H1).
# Dependency verification is lenient here only: the beta's sha256 is not in
# gradle/verification-metadata.xml and must not be. A red night means the next GeckoView needs work
# before its update pull request; no emulator runs, so crashes still show only after the update.

name: GeckoView beta

on:
  schedule:
    - cron: "47 3 * * *" # 06:47 Moscow time
  workflow_dispatch:
  pull_request: # a change to this workflow proves itself on the PR
    paths:
      - .github/workflows/geckoview-beta.yml

permissions:
  contents: read

concurrency:
  group: geckoview-beta-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  beta:
    name: Gecko build on the GeckoView beta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The platform build.yml compiles against.
      - name: Install Android SDK platform
        run: |
          sdkmanager "$(sed -nE 's/^  ANDROID_PLATFORM: "(.*)"$/\1/p' .github/workflows/build.yml)"

      - name: Switch to the newest GeckoView beta
        id: beta
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/geckoview-beta.xml" \
            https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-beta/maven-metadata.xml
          python3 scripts/ci/geckoview_latest.py check --metadata "$RUNNER_TEMP/geckoview-beta.xml" \
            | tee "$RUNNER_TEMP/beta.txt"
          beta="$(sed -n 's/^latest=//p' "$RUNNER_TEMP/beta.txt")"
          stable="$(sed -n 's/^current=//p' "$RUNNER_TEMP/beta.txt")"
          python3 scripts/ci/geckoview_latest.py apply "$beta"
          sed -i 's#"org.mozilla.geckoview:geckoview"#"org.mozilla.geckoview:geckoview-beta"#' \
            gradle/libs.versions.toml
          grep -q 'org.mozilla.geckoview:geckoview-beta' gradle/libs.versions.toml
          echo "beta=${beta}" >> "$GITHUB_OUTPUT"
          echo "stable=${stable}" >> "$GITHUB_OUTPUT"

      # Same flags and heap as the unit tests in build.yml.
      - name: Compile and unit tests
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2 --dependency-verification=lenient
          "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
          verifyNoPlayServicesDependencies
          testFullDebugUnitTest

      - name: Summary
        if: always()
        env:
          BETA: ${{ steps.beta.outputs.beta }}
          STABLE: ${{ steps.beta.outputs.stable }}
          OUTCOME: ${{ job.status }}
        run: |
          # A green job proves little if no test ran: count them from the JUnit reports.
          tests="$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = [0, 0, 0]
          for path in glob.glob("app/build/test-results/testFullDebugUnitTest/*.xml"):
              suite = ET.parse(path).getroot()
              totals[0] += int(suite.get("tests", 0))
              totals[1] += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              totals[2] += int(suite.get("skipped", 0))
          print(f"{totals[0]} run, {totals[1]} failed, {totals[2]} skipped")
          PY
          )"
          {
            echo "### GeckoView beta"
            echo "- Stable in the catalog: \`${STABLE}\`"
            echo "- Beta built against: \`${BETA}\`"
            echo "- Gecko unit tests: ${tests}"
            echo "- Result: ${OUTCOME}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
