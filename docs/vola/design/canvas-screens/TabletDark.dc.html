<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Планшет — тёмная тема</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;family=Literata:opsz,wght@7..72,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1194px; height: 834px; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <dc-import name="Tablet" dark="{{true}}" accent="{{accent}}" hint-size="1194px,834px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["blue","green","orange","pink","violet","graphite"],"default":"blue"},"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'blue' };
  }
}
</script>
</body>
</html>
