<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шрифт 200 процентов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vs{--bg:#F4F4F6;--surface:#FFFFFF;--elev:#EBEBEF;--label:#111114;--label2:#55555D;--label3:#808088;--sep:#D8D8DE;--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vs.dk{--bg:#1C1C1E;--surface:#2A2A2D;--elev:#333337;--label:#F4F4F6;--label2:#A9A9B1;--label3:#7E7E86;--sep:#3A3A3E;--e1:0 0 0 .5px rgba(255,255,255,.07)}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div style="padding: 48px 16px 0; display: flex; flex-direction: column">
    <h1 style="margin: 0; font-size: 51px; line-height: 58px; font-weight: 700; letter-spacing: -1.2px">Настройки</h1>
    <div style="margin-top: 14px; min-height: 64px; border-radius: 12px; background: var(--elev); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 28px; color: var(--label3)">
      <svg class="i" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>Поиск
    </div>
    <div style="margin-top: 20px; border-radius: 12px; background: var(--surface); box-shadow: var(--e1); overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column">
          <sc-if value="{{r.divider}}" hint-placeholder-val="{{false}}"><div style="height: 0.5px; margin-left: 64px; background: var(--sep)"></div></sc-if>
          <div style="min-height: 52px; display: flex; align-items: center; gap: 14px; padding: 14px 12px 14px 14px">
            <span style="width: 36px; height: 36px; border-radius: 9px; background: {{r.tile}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none; align-self: flex-start; margin-top: 2px">
              <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; font-size: 28px; line-height: 36px">{{r.name}}<span style="display: block; font-size: 24px; line-height: 32px; color: var(--label2)">{{r.value}}</span></span>
            <svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label3)"><path d="M9.5 6l6 6-6 6"></path></svg>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; right: 16px; top: 16px; height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(0,0,0,.6); color: #FFFFFF; display: flex; align-items: center; font-size: 12px; font-weight: 600">Шрифт 200 %</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Конфиденциальность и защита', value: 'Стандарт', tile: '#1F9D55', icon: 'M12 3l7 3v5.5c0 4.3-2.9 8-7 9.5-4.1-1.5-7-5.2-7-9.5V6l7-3zM9 12l2 2 4-4' },
      { name: 'Частный режим', value: '', tile: '#7B57E0', icon: 'M3 11h18M6 11l1.6-5.2a1 1 0 0 1 1-.8h6.8a1 1 0 0 1 1 .8L18 11' },
      { name: 'Пароли', value: '86', tile: '#E5383B', icon: 'M8 11a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM11 12l8.5-8.5M16.5 6.5l2.5 2.5' },
      { name: 'Чтение и прослушивание', value: '', tile: '#0E8C8C', icon: 'M4 14v-2a8 8 0 0 1 16 0v2M3.5 13.5h4.5v7H5.5a2 2 0 0 1-2-2zM20.5 13.5H16v7h2.5a2 2 0 0 0 2-2z' }
    ];
    return { mode: 'vs' + (this.props.dark ? ' dk' : ''), rows: rows.map((r, i) => ({ ...r, divider: i > 0 })) };
  }
}
</script>
</body>
</html>
