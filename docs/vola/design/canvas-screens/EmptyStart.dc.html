<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая вкладка нового профиля</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vl{--bg:#F4F4F6;--surface:#FFFFFF;--elev:#EBEBEF;--highest:#E0E0E5;--chrome:#F9F9FB;--label:#111114;--label2:#55555D;--label3:#808088;--sep:#D8D8DE;--fill:rgba(120,120,128,.12);--scrim:rgba(0,0,0,.32);--success:#1A7F45;--warning:#9A5600;--danger:#C42630;--edge:rgba(0,0,0,.08);--thick:rgba(244,244,246,.92);--regular:rgba(249,249,251,.84);--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);--e3:0 12px 40px rgba(0,0,0,.16);--accent:#2563D9;--accentFill:#2563D9;--softPct:14%;--softBase:#FFFFFF;--accentSoft:color-mix(in srgb,var(--accentFill) var(--softPct),var(--softBase));font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vl.dk{--bg:#1C1C1E;--surface:#2A2A2D;--elev:#333337;--highest:#3E3E43;--chrome:#262628;--label:#F4F4F6;--label2:#A9A9B1;--label3:#7E7E86;--sep:#3A3A3E;--fill:rgba(140,140,150,.22);--scrim:rgba(0,0,0,.5);--success:#4CC47E;--warning:#F0A53A;--danger:#FF6B6B;--edge:rgba(255,255,255,.06);--thick:rgba(30,30,32,.92);--regular:rgba(38,38,40,.84);--e1:0 0 0 .5px rgba(255,255,255,.07);--e2:0 8px 24px rgba(0,0,0,.4);--e3:0 16px 48px rgba(0,0,0,.55);--accent:#6E9BFF;--softPct:22%;--softBase:#1C1C1E}
.ac-orange{--accent:#B4520F;--accentFill:#B4520F}.dk.ac-orange{--accent:#FF9F5A}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 460px; background: radial-gradient(120% 75% at 50% -12%, var(--accentSoft) 0%, transparent 70%)"></div>
  <div style="position: relative; padding: 40px 16px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; height: 40px">
      <button style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--e1)">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: var(--accentFill); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5a1.5 1.5 0 0 1 1.5-1.5H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"></path></svg></span>
        <span style="font-size: 15px; font-weight: 600">Учёба</span>
        <svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label2)"><path d="M6 9.5l6 6 6-6"></path></svg>
      </button>
    </div>
    <h1 style="margin: 36px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.75px">Чистый лист</h1>
    <p style="margin: 8px 0 0; font-size: 17px; line-height: 24px; color: var(--label2)">У «Учёбы» свои cookie и история. Здесь вы ещё нигде не вошли.</p>

    <div style="margin-top: 28px; font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -0.4px">Закреплённые</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 18px; column-gap: 12px; margin-top: 14px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 60px; height: 60px; border-radius: 16px; background: var(--accentSoft); color: var(--accent); display: flex; align-items: center; justify-content: center"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M12 5v14M5 12h14"></path></svg></span>
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--accent)">Добавить</span>
      </div>
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 60px; height: 60px; border-radius: 16px; box-sizing: border-box; border: 1.5px dashed var(--sep)"></span>
          <span style="width: 40px; height: 8px; border-radius: 4px; background: var(--fill); margin-top: 4px"></span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 28px; border-radius: 24px; background: var(--surface); box-shadow: var(--e1); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.22px">Начать быстрее</div>
      <button style="height: 52px; border-radius: 14px; background: var(--fill); display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left">
        <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M7 3.8h10a1.2 1.2 0 0 1 1.2 1.2v15.2a.6.6 0 0 1-1 .5L12 16.6l-5.2 4.1a.6.6 0 0 1-1-.5V5A1.2 1.2 0 0 1 7 3.8z"></path></svg>
        <span style="flex: 1; font-size: 15px">Скопировать закладки из «Личного»</span>
      </button>
      <button style="height: 52px; border-radius: 14px; background: var(--fill); display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left">
        <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--accent)"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
        <span style="flex: 1; font-size: 15px">Переместить сюда вкладки</span>
      </button>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Bar" variant="start" tabs="1" dark="{{dark}}" accent="orange" hint-size="390px,88px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return { mode: 'vl ac-orange' + (dark ? ' dk' : ''), dark: dark, slots: [1, 2, 3] };
  }
}
</script>
</body>
</html>
