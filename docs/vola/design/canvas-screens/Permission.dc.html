<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Запрос разрешения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;family=Literata:opsz,wght@7..72,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vs{--sheet:rgba(244,244,246,.96);--surface:#FFFFFF;--elev:#EBEBEF;--label:#111114;--label2:#55555D;--fill:rgba(120,120,128,.12);--accent:#2563D9;--accentFill:#2563D9;--map:#E4ECE6;--road:#FFFFFF;font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vs.dk{--sheet:rgba(30,30,32,.96);--surface:#2A2A2D;--elev:#3E3E43;--label:#F4F4F6;--label2:#A9A9B1;--fill:rgba(140,140,150,.22);--accent:#6E9BFF;--map:#26302B;--road:#3A453F}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; font-family: Inter, system-ui, sans-serif; color: var(--label)">
  <div aria-hidden="true" style="position: absolute; inset: 0"><dc-import name="Page" dark="{{dark}}" hint-size="390px,844px"></dc-import></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.36)"></div>
  <div role="dialog" aria-label="Запрос местоположения" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 32px 32px 0 0; background: var(--sheet); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); padding: 12px 16px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div aria-hidden="true" style="display: flex; justify-content: center"><div style="width: 36px; height: 4px; border-radius: 2px; background: var(--label2); opacity: .4"></div></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #1F4E5F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">П</span>
      <div>
        <div style="font-size: 13px; line-height: 18px; color: var(--label2); font-weight: 600">polar-notes.ru</div>
        <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -0.4px">Хочет знать, где вы</h2>
      </div>
    </div>
    <div role="img" aria-label="Приблизительная область на карте" style="position: relative; height: 150px; border-radius: 20px; overflow: hidden; background: var(--map)">
      <svg width="358" height="150" viewBox="0 0 358 150" aria-hidden="true" style="position: absolute; inset: 0"><path d="M-10 110 C 80 90, 140 130, 220 80 S 330 40, 370 60" stroke-width="10" fill="none" style="stroke: var(--road)"></path><path d="M90 -10 L 130 160 M250 -10 L 210 160" stroke-width="6" fill="none" style="stroke: var(--road)"></path><path d="M0 30 C 60 20, 90 50, 140 30 L 140 0 L 0 0 Z" fill="#9CC8DF" opacity=".6"></path></svg>
      <span style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(37,99,217,.16); box-shadow: inset 0 0 0 1.5px rgba(37,99,217,.5)"></span>
      <span style="position: absolute; left: 12px; bottom: 10px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface); font-size: 12px; font-weight: 600; display: flex; align-items: center">Приблизительно · ~3 км</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 2px">
      <div style="flex: 1">
        <div style="font-size: 17px">Точное местоположение</div>
        <div style="font-size: 13px; line-height: 18px; color: var(--label2)">Сайту хватит района, чтобы показать погоду</div>
      </div>
      <button role="switch" aria-checked="false" aria-label="Точное местоположение" style="width: 51px; height: 31px; border-radius: 999px; background: var(--elev); padding: 2px; box-sizing: border-box; display: flex"><span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.2)"></span></button>
    </div>
    <button style="height: 52px; border-radius: 999px; background: var(--accentFill); color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.22px">Разрешить один раз</button>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; height: 48px; border-radius: 999px; background: var(--fill); font-size: 15px; font-weight: 500">Всегда для сайта</button>
      <button style="flex: 1; height: 48px; border-radius: 999px; background: var(--fill); font-size: 15px; font-weight: 500">Не разрешать</button>
    </div>
    <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--label2); text-align: center">Изменить потом — щит в адресной строке → «Разрешения»</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return { mode: 'vs' + (dark ? ' dk' : ''), dark: dark };
  }
}
</script>
</body>
</html>
