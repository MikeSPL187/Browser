<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тёмная тема — защита</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;family=Literata:opsz,wght@7..72,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1330px; height: 844px; display: flex; gap: 80px; background: #0E0E10; font-family: Inter, system-ui, sans-serif">
  <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; flex: none"><dc-import name="Shield" dark="{{true}}" accent="{{accent}}" hint-size="390px,844px"></dc-import></div>
  <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; flex: none"><dc-import name="Report" dark="{{true}}" accent="{{accent}}" hint-size="390px,844px"></dc-import></div>
  <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; flex: none"><dc-import name="Danger" dark="{{true}}" accent="{{accent}}" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["blue","green","orange","pink","violet","graphite"],"default":"blue","section":"Тема"},"$preview":{"width":1330,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'blue' };
  }
}
</script>
</body>
</html>
