<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Морфинг адресной строки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;family=Literata:opsz,wght@7..72,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mo{--sheet:rgba(244,244,246,.94);--card:#FFFFFF;--kb:#D9DAE0;--key:#FFFFFF;--ink:#111114;--ink2:#55555D;--acc:#2563D9}
.mo.dk{--sheet:rgba(30,30,32,.94);--card:#2A2A2D;--kb:#232325;--key:#47474C;--ink:#F4F4F6;--ink2:#A9A9B1;--acc:#6E9BFF}
.mo .ov{animation:ma-ov 4s infinite}
.mo .kb{animation:ma-kb 4s infinite cubic-bezier(.3,1.15,.4,1)}
.mo .fd{animation:ma-fd 4s infinite cubic-bezier(.3,1.15,.4,1)}
.mo .s1{animation:ma-s 4s infinite cubic-bezier(.3,1.15,.4,1)}
.mo .s2{animation:ma-s 4s infinite cubic-bezier(.3,1.15,.4,1);animation-delay:.03s}
.mo .s3{animation:ma-s 4s infinite cubic-bezier(.3,1.15,.4,1);animation-delay:.06s}
.mo.rm .ov,.mo.rm .kb,.mo.rm .s1,.mo.rm .s2,.mo.rm .s3,.mo.rm .fd{animation:ma-rm 4s infinite linear}
@keyframes ma-ov{0%,12%{opacity:0}21%,70%{opacity:1}79%,100%{opacity:0}}
@keyframes ma-kb{0%,12%{transform:translateY(256px)}21%,70%{transform:translateY(0)}79%,100%{transform:translateY(256px)}}
@keyframes ma-fd{0%,12%{bottom:32px;left:16px;width:250px}21%,70%{bottom:264px;left:16px;width:288px}79%,100%{bottom:32px;left:16px;width:250px}}
@keyframes ma-s{0%,14%{opacity:0;transform:translateY(40px)}23%,68%{opacity:1;transform:translateY(0)}76%,100%{opacity:0;transform:translateY(40px)}}
@keyframes ma-rm{0%,12%{opacity:0}16%,72%{opacity:1}76%,100%{opacity:0}}
</style>
</helmet>
<div class="{{cls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.013em; color: var(--ink)">
  <div aria-hidden="true" style="position: absolute; inset: 0"><dc-import name="Page" dark="{{dark}}" hint-size="390px,844px"></dc-import></div>
  <div class="ov" aria-hidden="true" style="position: absolute; inset: 0; background: var(--sheet); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px)"></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 324px; display: flex; flex-direction: column; gap: 10px">
    <div class="s3" style="height: 52px; border-radius: 12px; background: var(--card); display: flex; align-items: center; padding: 0 14px; font-size: 17px; gap: 12px">
      <span style="width: 28px; height: 28px; border-radius: 8px; background: #4B4B53"></span>Полка: что почитать осенью
    </div>
    <div class="s2" style="height: 52px; border-radius: 12px; background: var(--card); display: flex; align-items: center; padding: 0 14px; font-size: 17px; gap: 12px">
      <span style="width: 28px; height: 28px; border-radius: 8px; background: #E0620D"></span>Полезные завтраки на неделю
    </div>
    <div class="s1" style="height: 68px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--acc); display: flex; align-items: center; padding: 0 14px; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #1F4E5F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">П</span>
      <span><span style="display: block; font-size: 17px; font-weight: 600">Полярные заметки</span><span style="display: block; font-size: 13px; color: var(--acc); font-weight: 500">Перейти к вкладке</span></span>
    </div>
  </div>

  <div class="fd" style="position: absolute; left: 16px; bottom: 264px; width: 288px; height: 48px; border-radius: 999px; background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.14); display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box; font-size: 17px">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: var(--ink2); stroke-width: 1.8; stroke-linecap: round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
    <span style="white-space: nowrap; overflow: hidden">пол<span style="color: var(--ink2)">ярные заметки</span></span>
  </div>

  <div class="kb" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 256px; background: var(--kb); padding: 8px 4px 0; box-sizing: border-box; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); grid-auto-rows: 44px; gap: 10px 5px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="30"><span style="border-radius: 7px; background: var(--key); box-shadow: 0 1px 0 rgba(0,0,0,.25)"></span></sc-for>
  </div>

  <div style="position: absolute; top: 36px; left: 50%; transform: translateX(-50%); height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(0,0,0,.55); color: #FFFFFF; display: flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0; white-space: nowrap">{{label}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"reduced":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark, rm = !!this.props.reduced;
    return {
      cls: 'mo' + (dark ? ' dk' : '') + (rm ? ' rm' : ''),
      dark: dark,
      keys: Array.from({ length: 40 }, (_, i) => i),
      label: rm ? 'Без анимаций · прозрачность 150 мс' : 'Пружина 0,8 / 380 · ≈ 370 мс'
    };
  }
}
</script>
</body>
</html>
