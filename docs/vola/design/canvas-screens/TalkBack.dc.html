<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TalkBack — порядок чтения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; font-family: Inter, system-ui, sans-serif; font-feature-settings: 'cv11' 1">
  <div aria-hidden="true" style="position: absolute; inset: 0; opacity: .55"><dc-import name="Main" hint-size="390px,844px"></dc-import></div>
  <sc-for list="{{boxes}}" as="b" hint-placeholder-count="8">
    <div style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; width: {{b.w}}px; height: {{b.h}}px; border-radius: {{b.r}}px; box-sizing: border-box; border: {{b.border}}; box-shadow: {{b.glow}}">
      <span style="position: absolute; left: -10px; top: -10px; width: 24px; height: 24px; border-radius: 50%; background: {{b.badge}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.4)">{{b.n}}</span>
    </div>
  </sc-for>
  <div role="note" style="position: absolute; left: 16px; right: 16px; top: 452px; border-radius: 20px; background: rgba(20,20,22,.94); color: #F4F4F6; padding: 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #6CE7A8"><span style="width: 8px; height: 8px; border-radius: 50%; background: #6CE7A8"></span>Фокус 8 · TalkBack произносит</div>
    <div style="font-size: 17px; line-height: 23px; font-weight: 500">«Адресная строка. Поиск или адрес. Дважды коснитесь, чтобы ввести.»</div>
    <div style="font-size: 13px; line-height: 18px; color: #A9A9B1">Действия: Следующая вкладка · Предыдущая вкладка · Все вкладки. Затем: «Вкладки, 5», «Меню».</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      [12, 36, 132, 48, 999], [300, 36, 82, 48, 12], [12, 100, 366, 36, 10], [12, 142, 366, 190, 18],
      [12, 354, 366, 36, 10], [12, 396, 378, 182, 26], [12, 598, 366, 140, 26], [4, 758, 382, 60, 999]
    ];
    const boxes = raw.map((b, i) => {
      const cur = i === 7;
      return {
        n: i + 1, x: b[0], y: b[1], w: b[2], h: b[3], r: b[4],
        border: cur ? '3px solid #6CE7A8' : '2px dashed rgba(255,255,255,.75)',
        glow: cur ? '0 0 0 4px rgba(108,231,168,.3)' : 'none',
        badge: cur ? '#1A7F45' : '#2563D9'
      };
    });
    return { boxes: boxes };
  }
}
</script>
</body>
</html>
