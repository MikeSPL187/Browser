<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пароли</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vl{--bg:#F4F4F6;--surface:#FFFFFF;--elev:#EBEBEF;--highest:#E0E0E5;--chrome:#F9F9FB;--label:#111114;--label2:#55555D;--label3:#808088;--sep:#D8D8DE;--fill:rgba(120,120,128,.12);--scrim:rgba(0,0,0,.32);--success:#1A7F45;--warning:#9A5600;--danger:#C42630;--edge:rgba(0,0,0,.08);--thick:rgba(244,244,246,.92);--regular:rgba(249,249,251,.84);--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);--e3:0 12px 40px rgba(0,0,0,.16);--accent:#2563D9;--accentFill:#2563D9;--softPct:14%;--softBase:#FFFFFF;--accentSoft:color-mix(in srgb,var(--accentFill) var(--softPct),var(--softBase));font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em;--warnSoft:#FBF1E3}
.vl.dk{--bg:#1C1C1E;--surface:#2A2A2D;--elev:#333337;--highest:#3E3E43;--chrome:#262628;--label:#F4F4F6;--label2:#A9A9B1;--label3:#7E7E86;--sep:#3A3A3E;--fill:rgba(140,140,150,.22);--scrim:rgba(0,0,0,.5);--success:#4CC47E;--warning:#F0A53A;--danger:#FF6B6B;--edge:rgba(255,255,255,.06);--thick:rgba(30,30,32,.92);--regular:rgba(38,38,40,.84);--e1:0 0 0 .5px rgba(255,255,255,.07);--e2:0 8px 24px rgba(0,0,0,.4);--e3:0 16px 48px rgba(0,0,0,.55);--accent:#6E9BFF;--softPct:22%;--softBase:#1C1C1E;--warnSoft:#3A2E1C}
.ac-green{--accent:#1A7F45;--accentFill:#1A7F45}.dk.ac-green{--accent:#4CC47E}
.ac-orange{--accent:#B4520F;--accentFill:#B4520F}.dk.ac-orange{--accent:#FF9F5A}
.ac-pink{--accent:#BE2A68;--accentFill:#BE2A68}.dk.ac-pink{--accent:#FF7EAE}
.ac-violet{--accent:#6A45D1;--accentFill:#6A45D1}.dk.ac-violet{--accent:#A88FFF}
.ac-graphite{--accent:#4B4B53;--accentFill:#4B4B53}.dk.ac-graphite{--accent:#C9C9D1;--accentFill:#66666F}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.tn{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div style="padding: 28px 16px 0; display: flex; flex-direction: column">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
      <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 2px; margin-left: -6px; font-size: 17px; color: var(--accent); text-decoration: none">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M14.5 6l-6 6 6 6"></path></svg>Настройки
      </a>
      <button aria-label="Добавить пароль" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; color: var(--accent)">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <h1 style="margin: 4px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.75px">Пароли</h1>
    <label style="margin-top: 12px; height: 40px; border-radius: 12px; background: var(--elev); display: flex; align-items: center; gap: 8px; padding: 0 12px">
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label2)"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <input aria-label="Поиск по паролям" placeholder="Поиск по 86 паролям" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-size: 17px; color: var(--label)">
    </label>

    <div style="margin-top: 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--e1); padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--warnSoft); color: var(--warning); display: flex; align-items: center; justify-content: center; flex: none">
          <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M10.3 4.6L3 17.5A2 2 0 0 0 4.7 20.5h14.6a2 2 0 0 0 1.7-3L13.7 4.6a2 2 0 0 0-3.4 0z"></path><path d="M12 9.5v4.5M12 17.2h.01"></path></svg>
        </span>
        <div style="flex: 1">
          <div style="font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.22px">Проверка паролей</div>
          <div style="font-size: 13px; line-height: 18px; color: var(--label2)">Проверено на устройстве · сегодня</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="border-radius: 14px; background: var(--bg); padding: 10px 12px">
          <div class="tn" style="font-size: 22px; line-height: 28px; font-weight: 700; color: var(--warning)">2</div>
          <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--label2)">слабых</div>
        </div>
        <div style="border-radius: 14px; background: var(--bg); padding: 10px 12px">
          <div class="tn" style="font-size: 22px; line-height: 28px; font-weight: 700; color: var(--warning)">1</div>
          <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--label2)">повторяется</div>
        </div>
        <div style="border-radius: 14px; background: var(--bg); padding: 10px 12px">
          <div style="font-size: 22px; line-height: 28px; font-weight: 700; color: var(--label3)">—</div>
          <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--label2)">утечки</div>
        </div>
      </div>
      <button style="height: 44px; border-radius: 999px; background: var(--accentSoft); color: var(--accent); font-size: 15px; font-weight: 600">Проверить на утечки</button>
      <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--label2); margin-top: -6px">В сеть уйдут только первые 5 символов хеша каждого пароля</div>
    </div>

    <div style="margin: 20px 0 8px 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--label2)">A–L</div>
    <div style="border-radius: 12px; background: var(--surface); box-shadow: var(--e1); overflow: hidden">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column">
          <sc-if value="{{it.divider}}" hint-placeholder-val="{{false}}">
            <div style="height: 0.5px; margin-left: 58px; background: var(--sep)"></div>
          </sc-if>
          <div style="min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px">
            <span style="width: 32px; height: 32px; border-radius: 9px; background: {{it.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none">{{it.glyph}}</span>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 17px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.site}}</div>
              <div style="font-size: 13px; line-height: 18px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.login}}</div>
            </div>
            <sc-if value="{{it.warn}}" hint-placeholder-val="{{false}}">
              <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: var(--warnSoft); color: var(--warning); font-size: 12px; font-weight: 600; letter-spacing: 0; display: flex; align-items: center">{{it.warnText}}</span>
            </sc-if>
            <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label3)"><path d="M9.5 6l6 6-6 6"></path></svg>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; background: linear-gradient(transparent, var(--bg) 45%)">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; color: var(--label2)">
      <svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><rect x="5" y="10.5" width="14" height="10" rx="3"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>
      Хранилище KDBX · открыто по отпечатку
    </div>
    <div aria-hidden="true" style="height: 24px; display: flex; align-items: center"><div style="width: 108px; height: 4px; border-radius: 2px; background: var(--label); opacity: .4"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"accent":{"editor":"enum","options":["blue","green","orange","pink","violet","graphite"],"default":"blue","section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const list = [
      { site: 'atlas-maps.ru', login: 'm.ivanova', glyph: 'А', color: '#0E8C8C', warn: false },
      { site: 'kino-bilet.ru', login: 'm.ivanova@lumo.mail', glyph: 'Б', color: '#7B57E0', warn: true, warnText: 'Повтор' },
      { site: 'kinograd.ru', login: 'm.ivanova@lumo.mail', glyph: 'К', color: '#C2272D', warn: true, warnText: 'Слабый' },
      { site: 'lumo.mail', login: 'm.ivanova@lumo.mail', glyph: 'Л', color: '#3B5BDB', warn: false }
    ];
    const items = list.map((x, i) => ({ ...x, divider: i > 0 }));
    return { mode: 'vl' + (dark ? ' dk' : '') + ' ac-' + (this.props.accent ?? 'blue'), items: items };
  }
}
</script>
</body>
</html>
