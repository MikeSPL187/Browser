<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Только HTTPS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vl{--hBg:#F4F4F6;--surface:#FFFFFF;--label:#111114;--label2:#55555D;--fill:rgba(120,120,128,.12);--accent:#2563D9;--accentFill:#2563D9;--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vl.dk{--hBg:#1C1C1E;--surface:#2A2A2D;--label:#F4F4F6;--label2:#A9A9B1;--fill:rgba(140,140,150,.22);--accent:#6E9BFF;--e1:0 0 0 .5px rgba(255,255,255,.07);--e2:0 8px 24px rgba(0,0,0,.4)}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--hBg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div style="padding: 96px 24px 0; display: flex; flex-direction: column">
    <span style="width: 72px; height: 72px; border-radius: 22px; background: #2F6FE4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(47,111,228,.35)">
      <svg class="i" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><rect x="5" y="10.5" width="14" height="10" rx="3"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.8-1.2"></path></svg>
    </span>
    <h1 style="margin: 28px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.75px">У сайта нет защищённой версии</h1>
    <p style="margin: 12px 0 0; font-size: 17px; line-height: 24px; color: var(--label2)">Vola открывает сайты только по HTTPS. old-forum.ru отвечает лишь по HTTP — всё, что вы введёте, будет видно в сети.</p>
    <div style="margin-top: 20px; border-radius: 16px; background: var(--surface); box-shadow: var(--e1); padding: 14px 16px; display: flex; gap: 12px">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #1F9D55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M12 3l7 3v5.5c0 4.3-2.9 8-7 9.5-4.1-1.5-7-5.2-7-9.5V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
      </span>
      <div style="font-size: 13px; line-height: 18px; color: var(--label2)"><span style="display: block; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--label)">Читать можно, вводить — не стоит</span>Не вводите здесь пароли и данные карт.</div>
    </div>
    <button style="margin-top: 28px; height: 52px; border-radius: 999px; background: var(--accentFill); color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.22px; box-shadow: var(--e2)">Вернуться назад</button>
    <button style="margin-top: 10px; height: 48px; border-radius: 999px; background: var(--fill); font-size: 17px; font-weight: 500">Открыть по HTTP</button>
    <div style="margin-top: 10px; font-size: 13px; line-height: 18px; color: var(--label2); text-align: center">Исключение — только для old-forum.ru. Снять его можно в защите сайта.</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Bar" variant="neutral" domain="old-forum.ru" count="" tabs="5" dark="{{dark}}" hint-size="390px,88px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return { mode: 'vl' + (dark ? ' dk' : ''), dark: dark };
  }
}
</script>
</body>
</html>
