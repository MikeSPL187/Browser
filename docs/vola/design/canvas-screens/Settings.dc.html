<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vl{--bg:#F4F4F6;--surface:#FFFFFF;--elev:#EBEBEF;--highest:#E0E0E5;--chrome:#F9F9FB;--label:#111114;--label2:#55555D;--label3:#808088;--sep:#D8D8DE;--fill:rgba(120,120,128,.12);--scrim:rgba(0,0,0,.32);--success:#1A7F45;--warning:#9A5600;--danger:#C42630;--edge:rgba(0,0,0,.08);--thick:rgba(244,244,246,.92);--regular:rgba(249,249,251,.84);--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);--e3:0 12px 40px rgba(0,0,0,.16);--accent:#2563D9;--accentFill:#2563D9;--softPct:14%;--softBase:#FFFFFF;--accentSoft:color-mix(in srgb,var(--accentFill) var(--softPct),var(--softBase));font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vl.dk{--bg:#1C1C1E;--surface:#2A2A2D;--elev:#333337;--highest:#3E3E43;--chrome:#262628;--label:#F4F4F6;--label2:#A9A9B1;--label3:#7E7E86;--sep:#3A3A3E;--fill:rgba(140,140,150,.22);--scrim:rgba(0,0,0,.5);--success:#4CC47E;--warning:#F0A53A;--danger:#FF6B6B;--edge:rgba(255,255,255,.06);--thick:rgba(30,30,32,.92);--regular:rgba(38,38,40,.84);--e1:0 0 0 .5px rgba(255,255,255,.07);--e2:0 8px 24px rgba(0,0,0,.4);--e3:0 16px 48px rgba(0,0,0,.55);--accent:#6E9BFF;--softPct:22%;--softBase:#1C1C1E}
.ac-green{--accent:#1A7F45;--accentFill:#1A7F45}.dk.ac-green{--accent:#4CC47E}
.ac-orange{--accent:#B4520F;--accentFill:#B4520F}.dk.ac-orange{--accent:#FF9F5A}
.ac-pink{--accent:#BE2A68;--accentFill:#BE2A68}.dk.ac-pink{--accent:#FF7EAE}
.ac-violet{--accent:#6A45D1;--accentFill:#6A45D1}.dk.ac-violet{--accent:#A88FFF}
.ac-graphite{--accent:#4B4B53;--accentFill:#4B4B53}.dk.ac-graphite{--accent:#C9C9D1;--accentFill:#66666F}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.tn{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div style="padding: 60px 16px 0; display: flex; flex-direction: column">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.75px">Настройки</h1>
    <label style="margin-top: 12px; height: 40px; border-radius: 12px; background: var(--elev); display: flex; align-items: center; gap: 8px; padding: 0 12px">
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label2)"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <input aria-label="Поиск в настройках" placeholder="Поиск" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-size: 17px; color: var(--label)">
    </label>

    <a href="Profiles.dc.html" style="margin-top: 16px; min-height: 76px; border-radius: 16px; background: var(--surface); box-shadow: var(--e1); display: flex; align-items: center; gap: 14px; padding: 0 14px; color: var(--label); text-decoration: none">
      <span style="width: 52px; height: 52px; border-radius: 50%; background: var(--accentFill); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0">
        <span style="display: block; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.22px">Профиль «Личный»</span>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 18px; color: var(--label2)">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: var(--success)"></span>
          Синхронизация с планшетом · 2 мин назад
        </span>
      </span>
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label3)"><path d="M9.5 6l6 6-6 6"></path></svg>
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="margin-top: 24px; border-radius: 12px; background: var(--surface); box-shadow: var(--e1); overflow: hidden">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column">
            <sc-if value="{{r.divider}}" hint-placeholder-val="{{false}}">
              <div style="height: 0.5px; margin-left: 56px; background: var(--sep)"></div>
            </sc-if>
            <a href="{{r.href}}" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; color: var(--label); text-decoration: none">
              <span style="width: 30px; height: 30px; border-radius: 8px; background: {{r.tile}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
                <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="{{r.icon}}"></path></svg>
              </span>
              <span style="flex: 1; min-width: 0; font-size: 17px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
              <span class="tn" style="font-size: 17px; line-height: 22px; color: var(--label2)">{{r.value}}</span>
              <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label3)"><path d="M9.5 6l6 6-6 6"></path></svg>
            </a>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; align-items: center; justify-content: center; background: linear-gradient(transparent, var(--bg) 60%)">
    <div style="width: 108px; height: 4px; border-radius: 2px; background: var(--label); opacity: .4"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"accent":{"editor":"enum","options":["blue","green","orange","pink","violet","graphite"],"default":"blue","section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const I = {
      gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7',
      search: 'M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.2-4.2',
      tabs: 'M8.5 8.5h11v11h-11zM5 15.5V5.5a1 1 0 0 1 1-1h10',
      user: 'M12 12.3a3.8 3.8 0 1 0 0-7.6 3.8 3.8 0 0 0 0 7.6zM4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5',
      shield: 'M12 3l7 3v5.5c0 4.3-2.9 8-7 9.5-4.1-1.5-7-5.2-7-9.5V6l7-3zM9 12l2 2 4-4',
      mask: 'M3 11h18M6 11l1.6-5.2a1 1 0 0 1 1-.8h6.8a1 1 0 0 1 1 .8L18 11M7.5 13.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zM16.5 13.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z',
      key: 'M8 11a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM11 12l8.5-8.5M16.5 6.5l2.5 2.5M14 9l2 2',
      trash: 'M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13',
      palette: 'M12 3.5a8.5 8.5 0 1 0 0 17c1.1 0 1.7-.7 1.7-1.6 0-1-.8-1.4-.8-2.4 0-1 .8-1.7 1.7-1.7h2.2a3.7 3.7 0 0 0 3.7-3.7c0-4.2-3.8-7.6-8.5-7.6zM8 10.5h.01M11.5 7.5h.01M15.5 9h.01',
      read: 'M4 14v-2a8 8 0 0 1 16 0v2M3.5 13.5h4.5v7H5.5a2 2 0 0 1-2-2zM20.5 13.5H16v7h2.5a2 2 0 0 0 2-2z',
      lang: 'M4 6h9M8.5 4v2M6 6c.8 3 3 5.5 6 7M11 6c-.8 3-3 5.5-6.5 7.5M13 20l4-9 4 9M14.4 17h5.2',
      down: 'M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14',
      sync: 'M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5'
    };
    const raw = [
      [
        { name: 'Общие', tile: '#2F6FE4', icon: I.gear, value: '' },
        { name: 'Поиск', tile: '#2F6FE4', icon: I.search, value: '' },
        { name: 'Вкладки', tile: '#2F6FE4', icon: I.tabs, value: '' },
        { name: 'Профили', tile: '#4F5BD5', icon: I.user, value: '4', href: 'Profiles.dc.html' }
      ],
      [
        { name: 'Конфиденциальность и защита', tile: '#1F9D55', icon: I.shield, value: '', href: 'Report.dc.html' },
        { name: 'Частный режим', tile: '#7B57E0', icon: I.mask, value: '', href: 'Private.dc.html' },
        { name: 'Пароли', tile: '#E5383B', icon: I.key, value: '86', href: 'Passwords.dc.html' },
        { name: 'Очистка данных', tile: '#E5383B', icon: I.trash, value: '' }
      ],
      [
        { name: 'Внешний вид', tile: '#D93A7A', icon: I.palette, value: 'Как в системе' },
        { name: 'Чтение и прослушивание', tile: '#0E8C8C', icon: I.read, value: '', href: 'Reader.dc.html' },
        { name: 'Язык и перевод', tile: '#0E8C8C', icon: I.lang, value: '', href: 'Translate.dc.html' },
        { name: 'Загрузки', tile: '#C27A00', icon: I.down, value: '', href: 'Downloads.dc.html' },
        { name: 'Синхронизация', tile: '#1C8FD6', icon: I.sync, value: 'Вкл.', href: 'Sync.dc.html' }
      ]
    ];
    const groups = raw.map((rows) => ({ rows: rows.map((r, i) => ({ ...r, divider: i > 0, href: r.href || 'Settings.dc.html' })) }));
    return { mode: 'vl' + (dark ? ' dk' : '') + ' ac-' + (this.props.accent ?? 'blue'), groups: groups };
  }
}
</script>
</body>
</html>
