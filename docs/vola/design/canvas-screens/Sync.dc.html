<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Связать устройства</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vl{--bg:#F4F4F6;--surface:#FFFFFF;--elev:#EBEBEF;--highest:#E0E0E5;--chrome:#F9F9FB;--label:#111114;--label2:#55555D;--label3:#808088;--sep:#D8D8DE;--fill:rgba(120,120,128,.12);--scrim:rgba(0,0,0,.32);--success:#1A7F45;--warning:#9A5600;--danger:#C42630;--edge:rgba(0,0,0,.08);--thick:rgba(244,244,246,.92);--regular:rgba(249,249,251,.84);--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);--e3:0 12px 40px rgba(0,0,0,.16);--accent:#2563D9;--accentFill:#2563D9;--softPct:14%;--softBase:#FFFFFF;--accentSoft:color-mix(in srgb,var(--accentFill) var(--softPct),var(--softBase));font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vl.dk{--bg:#1C1C1E;--surface:#2A2A2D;--elev:#333337;--highest:#3E3E43;--chrome:#262628;--label:#F4F4F6;--label2:#A9A9B1;--label3:#7E7E86;--sep:#3A3A3E;--fill:rgba(140,140,150,.22);--scrim:rgba(0,0,0,.5);--success:#4CC47E;--warning:#F0A53A;--danger:#FF6B6B;--edge:rgba(255,255,255,.06);--thick:rgba(30,30,32,.92);--regular:rgba(38,38,40,.84);--e1:0 0 0 .5px rgba(255,255,255,.07);--e2:0 8px 24px rgba(0,0,0,.4);--e3:0 16px 48px rgba(0,0,0,.55);--accent:#6E9BFF;--softPct:22%;--softBase:#1C1C1E}
.ac-green{--accent:#1A7F45;--accentFill:#1A7F45}.dk.ac-green{--accent:#4CC47E}
.ac-orange{--accent:#B4520F;--accentFill:#B4520F}.dk.ac-orange{--accent:#FF9F5A}
.ac-pink{--accent:#BE2A68;--accentFill:#BE2A68}.dk.ac-pink{--accent:#FF7EAE}
.ac-violet{--accent:#6A45D1;--accentFill:#6A45D1}.dk.ac-violet{--accent:#A88FFF}
.ac-graphite{--accent:#4B4B53;--accentFill:#4B4B53}.dk.ac-graphite{--accent:#C9C9D1;--accentFill:#66666F}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.tn{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div style="padding: 28px 16px 0; display: flex; flex-direction: column">
    <div style="height: 44px; display: flex; align-items: center">
      <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 2px; margin-left: -6px; font-size: 17px; color: var(--accent); text-decoration: none">
        <svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><path d="M14.5 6l-6 6 6 6"></path></svg>Синхронизация
      </a>
    </div>
    <h1 style="margin: 4px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.75px">Связать устройства</h1>
    <p style="margin: 8px 0 0; font-size: 15px; line-height: 20px; color: var(--label2)">На планшете откройте Vola → Настройки → Синхронизация и наведите камеру на код.</p>

    <div style="margin-top: 20px; align-self: center; width: 252px; border-radius: 28px; background: #FFFFFF; box-shadow: var(--e2); padding: 26px; box-sizing: border-box; position: relative">
      <div role="img" aria-label="Код для связи устройств" style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); width: 200px; height: 200px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
          <span style="width: 8px; height: 8px; background: {{c}}; border-radius: 1.5px"></span>
        </sc-for>
      </div>
      <span style="position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #FFFFFF">
        <svg width="40" height="40" viewBox="0 0 108 108" aria-hidden="true" style="display: block">
          <defs>
            <linearGradient id="sync-vl" x1="29.5" y1="30" x2="51.5" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A78BFA"></stop><stop offset="1" stop-color="#6D4CFF"></stop></linearGradient>
            <linearGradient id="sync-vr" x1="77.5" y1="28" x2="51.5" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"></stop><stop offset="1" stop-color="#3B6BFF"></stop></linearGradient>
          </defs>
          <path d="M31,34 C35.5,52.5 42.5,67.5 51.5,78.5" fill="none" stroke="url(#sync-vl)" stroke-width="13" stroke-linecap="round"></path>
          <path d="M51.5,78.5 C58.5,62.5 66.5,44.5 77,30" fill="none" stroke="url(#sync-vr)" stroke-width="13" stroke-linecap="round"></path>
        </svg>
      </span>
    </div>
    <div style="margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div class="tn" style="font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: 1px">4827 · 1960</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--label2)">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="display: block; transform: rotate(-90deg)"><circle cx="12" cy="12" r="9" fill="none" stroke-width="3" style="stroke: var(--fill)"></circle><circle cx="12" cy="12" r="9" fill="none" stroke-width="3" stroke-dasharray="45.2 56.6" stroke-linecap="round" style="stroke: var(--accent)"></circle></svg>
        <span class="tn">Новый код через 0:48</span>
      </div>
    </div>

    <div style="margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
        <span style="height: 32px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--accentSoft); color: var(--accent); display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600">
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{k}}
        </span>
      </sc-for>
    </div>
    <div style="margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--label2); text-align: center">
      <svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.2"><rect x="5" y="10.5" width="14" height="10" rx="3"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>
      Сквозное шифрование · только в вашей сети Wi‑Fi
    </div>

    <a href="Settings.dc.html" style="margin-top: 20px; min-height: 64px; border-radius: 12px; background: var(--surface); box-shadow: var(--e1); display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px; color: var(--label); text-decoration: none">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #1C8FD6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M7 18.5a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 10z"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0">
        <span style="display: block; font-size: 17px; line-height: 22px">Свой сервер (WebDAV)</span>
        <span style="display: block; font-size: 13px; line-height: 18px; color: var(--label2)">Nextcloud и другие — зашифрованный файл</span>
      </span>
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--label3)"><path d="M9.5 6l6 6-6 6"></path></svg>
    </a>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; align-items: center; justify-content: center">
    <div style="width: 108px; height: 4px; border-radius: 2px; background: var(--label); opacity: .4"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"accent":{"editor":"enum","options":["blue","green","orange","pink","violet","graphite"],"default":"blue","section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const N = 25;
    let seed = 1960;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      const ring = Math.max(Math.abs(y - 3), Math.abs(x - 3));
      return ring === 3 || ring <= 1;
    };
    const cells = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        let on = null;
        for (const [r0, c0] of [[0, 0], [0, 18], [18, 0]]) {
          const f = finder(r, c, r0, c0);
          if (f !== null) on = f;
        }
        const nearFinder = (r < 8 && c < 8) || (r < 8 && c > 16) || (r > 16 && c < 8);
        const center = r >= 9 && r <= 15 && c >= 9 && c <= 15;
        if (on === null) {
          if (nearFinder || center) on = false;
          else if (r === 6) on = c % 2 === 0;
          else if (c === 6) on = r % 2 === 0;
          else on = rnd() > 0.52;
        }
        cells.push(on ? '#111114' : 'transparent');
      }
    }
    return { mode: 'vl' + (dark ? ' dk' : '') + ' ac-' + (this.props.accent ?? 'blue'), cells: cells, kinds: ['Вкладки', 'Закладки', 'История', 'Пароли'] };
  }
}
</script>
</body>
</html>
