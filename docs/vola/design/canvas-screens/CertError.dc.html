<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ошибка сертификата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.vl{--certBg:#FBF4EA;--surface:#FFFFFF;--label:#111114;--label2:#55555D;--sep:#D8D8DE;--warning:#9A5600;--accent:#2563D9;--accentFill:#2563D9;--e1:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--e2:0 2px 6px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);font-feature-settings:'cv11' 1;-webkit-font-smoothing:antialiased;letter-spacing:-0.013em}
.vl.dk{--certBg:#262019;--surface:#2A2A2D;--label:#F4F4F6;--label2:#A9A9B1;--sep:#3A3A3E;--warning:#F0A53A;--accent:#6E9BFF;--e1:0 0 0 .5px rgba(255,255,255,.07);--e2:0 8px 24px rgba(0,0,0,.4)}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.tn{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--certBg); color: var(--label); font-family: Inter, system-ui, sans-serif">
  <div style="padding: 96px 24px 0; display: flex; flex-direction: column">
    <span style="width: 72px; height: 72px; border-radius: 22px; background: #C27A00; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(194,122,0,.35)">
      <svg class="i" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><rect x="5" y="10.5" width="14" height="10" rx="3"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 6.6-1.6"></path><path d="M12 14v2.5"></path></svg>
    </span>
    <h1 style="margin: 28px 0 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.75px">Соединение не защищено</h1>
    <p style="margin: 12px 0 0; font-size: 17px; line-height: 24px; color: var(--label2)">Сертификат lumo.mail истёк. Пока это так, кто-то в той же сети может читать и подменять данные — например, пароль.</p>
    <div style="margin-top: 20px; border-radius: 16px; background: var(--surface); box-shadow: var(--e1); overflow: hidden">
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 15px"><span style="color: var(--label2)">Проблема</span><span style="font-weight: 600; color: var(--warning)">Срок действия истёк</span></div>
      <div style="height: 0.5px; margin-left: 16px; background: var(--sep)"></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 15px"><span style="color: var(--label2)">Действовал до</span><span class="tn" style="font-weight: 500">20 октября 2026</span></div>
      <div style="height: 0.5px; margin-left: 16px; background: var(--sep)"></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 15px"><span style="color: var(--label2)">Часы на телефоне</span><span style="font-weight: 500">Верные</span></div>
    </div>
    <button style="margin-top: 28px; height: 52px; border-radius: 999px; background: var(--accentFill); color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.22px; box-shadow: var(--e2)">Вернуться назад</button>
    <button style="margin-top: 6px; height: 44px; font-size: 13px; color: var(--label2); text-decoration: underline; text-underline-offset: 3px">Подробнее и открыть на свой риск</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="Bar" variant="neutral" domain="lumo.mail" count="" tabs="5" dark="{{dark}}" hint-size="390px,88px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    return { mode: 'vl' + (dark ? ' dk' : ''), dark: dark };
  }
}
</script>
</body>
</html>
