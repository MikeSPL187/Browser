<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Предпросмотр ссылки — движение</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;family=Literata:opsz,wght@7..72,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mo .pg{animation:mg-pg 4.4s infinite cubic-bezier(.3,1.25,.45,1)}
.mo .sr{animation:mg-sr 4.4s infinite}
.mo .cd{animation:mg-cd 4.4s infinite cubic-bezier(.3,1.25,.45,1)}
.mo .lk{animation:mg-lk 4.4s infinite}
.mo.rm .pg{animation:none}
.mo.rm .sr{animation:mg-rm 4.4s infinite linear}
.mo.rm .cd{animation:mg-rm 4.4s infinite linear;transform:none}
.mo.rm .lk{animation:none;opacity:0}
@keyframes mg-pg{0%,18%{transform:scale(1)}28%,70%{transform:scale(.97)}80%,100%{transform:scale(1)}}
@keyframes mg-sr{0%,18%{opacity:0}28%,70%{opacity:1}80%,100%{opacity:0}}
@keyframes mg-cd{0%,18%{opacity:0;transform:translate(30px,300px) scale(.12)}21%{opacity:1}28%,70%{opacity:1;transform:translate(0,0) scale(1)}78%{opacity:1;transform:translate(0,40px) scale(.94)}82%,100%{opacity:0;transform:translate(0,80px) scale(.9)}}
@keyframes mg-lk{0%,6%{opacity:0;transform:scale(1)}8%{opacity:1}18%{opacity:1;transform:scale(1.03)}24%,100%{opacity:0;transform:scale(1.03)}}
@keyframes mg-rm{0%,18%{opacity:0}22%,70%{opacity:1}74%,100%{opacity:0}}
</style>
</helmet>
<div class="{{cls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; font-family: Inter, system-ui, sans-serif; letter-spacing: -0.013em">
  <div class="pg" style="position: absolute; inset: 0; transform-origin: 50% 70%; border-radius: 40px; overflow: hidden"><dc-import name="Page" dark="{{dark}}" hint-size="390px,844px"></dc-import></div>
  <div class="lk" aria-hidden="true" style="position: absolute; left: 180px; top: 690px; width: 150px; height: 30px; border-radius: 8px; background: rgba(37,99,217,.18); box-shadow: 0 0 0 2px rgba(37,99,217,.5); opacity: 0"></div>
  <div class="sr" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.42)"></div>
  <div class="cd" style="position: absolute; left: 16px; right: 16px; top: 96px; height: 560px; border-radius: 24px; overflow: hidden; background: #FFFFFF; color: #16201C; box-shadow: 0 24px 60px rgba(0,0,0,.35); transform-origin: 60% 100%">
    <div style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border-bottom: 0.5px solid #D8D8DE">severdom.ru</div>
    <div style="height: 46px; background: #2F5D50; color: #FFFFFF; display: flex; align-items: center; padding: 0 16px; font-size: 17px; font-weight: 700">Север<span style="color: #F2C46D">·</span>дом</div>
    <div style="height: 210px; background: linear-gradient(180deg, #1B2747 0%, #4A3F72 55%, #C9849A 80%, #E7EEF7 81%)"></div>
    <div style="padding: 16px">
      <div style="font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.4px">Дома у залива: где ночевать в Териберке</div>
      <div style="margin-top: 8px; font-size: 15px; line-height: 22px; color: #5E6B66">Панорамные окна на север, сауна и трансфер от Мурманска.</div>
    </div>
  </div>
  <div style="position: absolute; top: 36px; left: 50%; transform: translateX(-50%); height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(0,0,0,.55); color: #FFFFFF; display: flex; align-items: center; font-size: 12px; font-weight: 600; white-space: nowrap">{{label}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"reduced":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark, rm = !!this.props.reduced;
    return { cls: 'mo' + (rm ? ' rm' : ''), dark: dark, label: rm ? 'Без анимаций · смена прозрачностью' : 'Удержание 400 мс · пружина 0,75 / 400' };
  }
}
</script>
</body>
</html>
