<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка вкладки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; gap: 7px; font-family: Inter, system-ui, sans-serif; color: var(--label, #111114); letter-spacing: -0.013em">
  <div style="position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: {{c.bg}}; box-shadow: {{shadow}}">
    <div style="height: 26px; background: {{c.fav}}; display: flex; align-items: center; padding: 0 9px"><span style="width: 52px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85)"></span></div>
    <div style="height: 42%; background: {{c.img}}"></div>
    <div style="padding: 10px 9px 0; display: flex; flex-direction: column; gap: 6px">
      <div style="width: 86%; height: 7px; border-radius: 3px; background: {{ink}}; opacity: .8"></div>
      <div style="width: 100%; height: 4px; border-radius: 2px; background: {{ink}}; opacity: .22; margin-top: 4px"></div>
      <div style="width: 92%; height: 4px; border-radius: 2px; background: {{ink}}; opacity: .22"></div>
      <div style="width: 64%; height: 4px; border-radius: 2px; background: {{ink}}; opacity: .22"></div>
    </div>
    <button aria-label="Закрыть вкладку" style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; padding: 0; border-radius: 50%; background: rgba(0,0,0,.34); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="display: block; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
    </button>
  </div>
  <div style="display: flex; align-items: center; gap: 6px; padding: 0 2px">
    <span style="width: 16px; height: 16px; border-radius: 5px; background: {{c.fav}}; color: #FFFFFF; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">{{c.g}}</span>
    <span style="font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.t}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"card":{"editor":null},"$preview":{"width":213,"height":316}}'>
class Component extends DCLogic {
  renderVals() {
    const c = this.props.card ?? { t: 'Северное сияние над Териберкой', g: 'П', fav: '#1F4E5F', img: 'linear-gradient(180deg,#06131D,#18414B)', bg: '#FFFFFF', active: true };
    const darkBg = c.bg === '#121216' || c.bg === '#16141F' || c.bg === '#111114';
    return {
      c: c,
      ink: darkBg ? '#FFFFFF' : '#1B2328',
      shadow: c.active ? '0 0 0 2.5px var(--bg, #F4F4F6), 0 0 0 4.5px var(--accent, #2563D9), 0 8px 24px rgba(0,0,0,.08)' : '0 1px 3px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04)'
    };
  }
}
</script>
</body>
</html>
