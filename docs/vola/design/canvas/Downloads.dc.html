<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — загрузки</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px">
<button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button>
<span style="flex-grow: 1"></span>
<button class="ib" aria-label="Поиск"><svg class="i" viewBox="0 0 24 24"><path d="{{i.search}}"></path></svg></button>
</div>
<h1 class="t-display" style="padding: 0 4px">Загрузки</h1>
<div style="border-radius: 26px; background: var(--surface); box-shadow: var(--shadow-sm); padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px">
<span class="lead" style="width: 48px; height: 48px; border-radius: 16px; background: {{c.a14}}; color: {{c.a}}"><svg class="i" viewBox="0 0 24 24"><path d="{{i.file}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Карта маршрутов Байкала.pdf</span><span class="t-sub">[__ МБ] из [__ МБ] · осталось [__]</span></span>
<button class="ib" aria-label="Пауза" style="background: var(--s-high)"><svg class="i" viewBox="0 0 24 24"><path d="{{i.pause}}"></path></svg></button>
</div>
<svg viewBox="0 0 326 12" style="width: 100%; height: 12px" aria-label="Загружено 62%"><path d="M4 6 Q 10 1 16 6 T 28 6 T 40 6 T 52 6 T 64 6 T 76 6 T 88 6 T 100 6 T 112 6 T 124 6 T 136 6 T 148 6 T 160 6 T 172 6 T 184 6 T 196 6" fill="none" stroke="{{c.a}}" stroke-width="4" stroke-linecap="round"></path><path d="M208 6 H 322" fill="none" stroke="{{c.a20}}" stroke-width="4" stroke-linecap="round"></path></svg>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="4">
<button style="height: 36px; border-radius: 12px; padding: 0 12px; font-size: 13px; font-weight: 700; background: {{ch.bg}}; color: {{ch.fg}}; box-shadow: {{ch.ring}}">{{ch.label}}</button>
</sc-for>
</div>
<span class="t-over" style="padding: 4px 4px 0">Сегодня</span>
<div class="group">
<sc-for list="{{files}}" as="f" hint-placeholder-count="4">
<div class="row" style="min-height: 64px">
<span class="lead" style="background: {{f.bg}}; color: {{f.fg}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{f.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span><span class="t-sub">{{f.meta}}</span></span>
<button class="ib" aria-label="Действия с файлом" style="width: 40px; height: 40px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
const i = window.VI || {};
const off = { bg: 'var(--surface)', fg: 'var(--on-var)', ring: 'inset 0 0 0 1px var(--outline-var)' };
return {
i: i,
c: window.VA ? window.VA(accent) : { a: accent },
chips: [
{ label: 'Все', bg: accent, fg: '#FFFFFF', ring: 'none' },
Object.assign({ label: 'Документы' }, off),
Object.assign({ label: 'Фото' }, off),
Object.assign({ label: 'Видео' }, off)
],
files: [
{ name: 'Снаряжение для льда.pdf', meta: 'Документ · north-guide.ru', icon: i.file, bg: '#FFE1D6', fg: '#9A3A1E' },
{ name: 'olkhon-grotto.jpg', meta: 'Изображение · 14:10', icon: i.image, bg: '#D4F1EC', fg: '#00665A' },
{ name: 'Отчёт по метрикам.xlsx', meta: 'Таблица · 11:52', icon: i.file, bg: '#D3F0D9', fg: '#2B6C3F' },
{ name: 'launch-plan.docx', meta: 'Документ · 10:31', icon: i.file, bg: '#DDE3FF', fg: '#2F4AA8' }
]
};
}
}
</script>
</body>
</html>
