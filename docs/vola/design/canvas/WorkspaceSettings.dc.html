<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — настройки пространства</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; inset: 0; background: radial-gradient(120% 60% at 0% 0%, {{c.a45}}, rgba(243,238,247,0) 70%)"></div>
<div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 50px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 6px"><span style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 28px; background: rgba(255,255,255,0.6)"><i style="width: 44px; height: 44px; border-radius: 22px"></i><span style="height: 44px; width: 112px; border-radius: 16px; background: #006877"></span><i style="width: 44px; height: 44px; border-radius: 22px"></i><i style="width: 44px; height: 44px; border-radius: 22px"></i></span><span style="flex-grow: 1"></span><i style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.6)"></i></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px"><i style="height: 60px; border-radius: 20px; background: #FFFFFF"></i><i style="height: 60px; border-radius: 20px; background: #FFFFFF"></i><i style="height: 60px; border-radius: 20px; background: #FFFFFF"></i><i style="height: 60px; border-radius: 20px; background: #FFFFFF"></i><i style="height: 60px; border-radius: 20px; background: #FFFFFF"></i></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 30px"><i style="height: 196px; border-radius: 24px; background: #FFFFFF"></i><i style="height: 196px; border-radius: 24px; background: #FFFFFF"></i></div>
</div>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div class="sheet" style="padding: 0 16px 32px; display: flex; flex-direction: column; gap: 14px">
<div class="handle"></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 6px 4px 4px">
<div style="width: 64px; height: 64px; border-radius: 24px; background: {{c.a}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i l" viewBox="0 0 24 24"><path d="{{i.work}}"></path></svg></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-h2">Работа</span><span class="t-sub">4 вкладки · 6 в Essentials</span></div>
<button class="ib" aria-label="Переименовать" style="background: var(--surface)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.edit}}"></path></svg></button>
</div>
<div role="radiogroup" aria-label="Цвет пространства" style="display: flex; justify-content: space-between; padding: 0 4px">
<sc-for list="{{accents}}" as="a" hint-placeholder-count="8">
<span role="radio" aria-checked="{{a.checked}}" aria-label="{{a.name}}" style="width: 36px; height: 36px; border-radius: 18px; box-shadow: inset 0 0 0 2.5px {{a.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: {{a.dot}}; height: {{a.dot}}; border-radius: 50%; background: {{a.color}}; display: block"></span></span>
</sc-for>
</div>
<div class="group">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<a href="#" class="row">
<span class="lead" style="background: {{c.a10}}; color: {{c.a}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label">{{r.title}}</span><span class="t-sub">{{r.sub}}</span></span>
<svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg>
</a>
</sc-for>
</div>
<div class="group">
<div class="row"><span class="lead" style="background: {{c.a10}}; color: {{c.a}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.cookie}}"></path></svg></span><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label">Отдельное хранилище</span><span class="t-sub">Свои cookie и входы</span></div><span class="sw on" style="background: {{c.a}}"><span></span></span></div>
<div class="row"><span class="lead" style="background: {{c.a10}}; color: {{c.a}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.fingerprint}}"></path></svg></span><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label">Вход по биометрии</span><span class="t-sub">После 5 минут в фоне</span></div><span class="sw on" style="background: {{c.a}}"><span></span></span></div>
</div>
<button style="height: 52px; border-radius: 26px; box-shadow: inset 0 0 0 1px var(--outline-var); color: var(--danger); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.trash}}"></path></svg>Удалить пространство</button>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
const i = window.VI || {};
const palette = [['Фиолетовый', '#5E4EB7'], ['Синий', '#2F5BD3'], ['Бирюзовый', '#006877'], ['Зелёный', '#2B6C3F'], ['Янтарный', '#7C5800'], ['Коралловый', '#A23F2B'], ['Розовый', '#A0305B'], ['Графитовый', '#55595F']];
return {
i: i,
c: window.VA ? window.VA(accent) : { a: accent },
accents: palette.map((p) => ({ name: p[0], color: p[1], checked: p[1] === accent ? 'true' : 'false', ring: p[1] === accent ? p[1] : 'transparent', dot: p[1] === accent ? '24px' : '30px' })),
rows: [
{ icon: i.star, title: 'Essentials', sub: '6 сайтов · свои для пространства' },
{ icon: i.palette, title: 'Фон и значок', sub: 'Градиент, иконка портфеля' },
{ icon: i.search, title: 'Поиск по умолчанию', sub: 'Как в браузере · DuckDuckGo' },
{ icon: i.shield, title: 'Защита', sub: 'Строгая блокировка трекеров' }
]
};
}
}
</script>
</body>
</html>
