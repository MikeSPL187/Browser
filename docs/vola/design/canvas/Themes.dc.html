<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — темы</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button><span class="t-title">Темы</span></div>
<div style="height: 240px; border-radius: 30px; background: {{bgGrad}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
<div style="width: 176px; height: 204px; border-radius: {{rPhone}}; background: {{pageBg}}; box-shadow: var(--shadow); position: relative; padding: 16px 12px; display: flex; flex-direction: column; gap: {{gap}}">
<div style="height: 9px; width: 70%; border-radius: 5px; background: {{line}}"></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"><span style="height: 30px; border-radius: {{rTile}}; background: {{t}}; display: block"></span></sc-for>
</div>
<div style="height: 50px; border-radius: {{rTile}}; background: {{soft}}"></div>
<div style="height: 7px; width: 90%; border-radius: 4px; background: {{line}}"></div>
<div style="position: absolute; left: 8px; right: 8px; bottom: 10px; height: 34px; border-radius: {{rBar}}; background: {{barBg}}; box-shadow: 0 6px 14px rgba(0,0,0,0.16); display: flex; align-items: center; gap: 6px; padding: 0 6px"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{accent}}"></span><span style="height: 6px; width: 70px; border-radius: 3px; background: {{line}}"></span></div>
</div>
</div>
<div style="display: flex; gap: 8px; overflow: hidden; padding: 6px; margin: -6px -16px -6px -6px">
<sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="width: 66px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 60px; height: 60px; border-radius: 20px; background: {{p.swatch}}; box-shadow: {{p.ring}}; display: block"></span>
<span style="font-size: 12px; font-weight: 700; color: var(--on-var)">{{p.name}}</span>
</button>
</sc-for>
</div>
<div class="group">
<div class="row" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px">
<div style="display: flex; justify-content: space-between"><span class="t-label" style="font-size: 15px">Акцент</span><span class="t-sub" style="font-weight: 800">Как у пространства</span></div>
<div style="display: flex; gap: 10px; align-items: center">
<span style="width: 36px; height: 36px; border-radius: 18px; background: conic-gradient(#5E4EB7 0 25%, #006877 25% 50%, #A23F2B 50% 75%, #2F5BD3 75% 100%); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px #5E4EB7"></span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #5E4EB7"></span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #006877"></span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #A23F2B"></span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #2B6C3F"></span>
<button aria-label="Свой цвет" style="width: 36px; height: 36px; border-radius: 18px; box-shadow: inset 0 0 0 1.5px var(--outline); display: flex; align-items: center; justify-content: center; color: var(--on-var)"><svg class="i xs" viewBox="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
</div>
</div>
<div class="row" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px">
<span class="t-label" style="font-size: 15px">Скругления</span>
<div role="radiogroup" style="display: flex; gap: 4px">
<sc-for list="{{radii}}" as="r" hint-placeholder-count="3">
<button role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="flex: 1; height: 44px; border-radius: {{r.shape}}; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 800; text-align: center">{{r.name}}</button>
</sc-for>
</div>
</div>
<div class="row" style="flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px">
<span class="t-label" style="font-size: 15px">Плотность</span>
<div role="radiogroup" style="display: flex; gap: 4px">
<sc-for list="{{dens}}" as="d" hint-placeholder-count="3">
<button role="radio" aria-checked="{{d.on}}" onClick="{{d.pick}}" style="flex: 1; height: 44px; border-radius: 14px; background: {{d.bg}}; color: {{d.fg}}; font-size: 14px; font-weight: 800; text-align: center">{{d.name}}</button>
</sc-for>
</div>
</div>
</div>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { preset: 0, radius: 2, density: 1 };
}
renderVals() {
const presets = [
{ name: 'Vola', accent: '#5E4EB7', grad: 'linear-gradient(135deg, #D9D0FF, #CDEFF3)', page: '#FFFFFF', bar: 'rgba(250,246,253,0.95)', line: '#DDD7E3', tiles: ['#DDE3FF', '#D4F1EC', '#FFE1D6', '#E6DEFF'] },
{ name: 'Лёд', accent: '#006877', grad: 'linear-gradient(135deg, #C9EEF2, #DCE6F7)', page: '#FFFFFF', bar: 'rgba(244,250,251,0.95)', line: '#D5E2E5', tiles: ['#D4F1EC', '#D8EEFF', '#E3F1F6', '#CFE7EC'] },
{ name: 'Сумерки', accent: '#C9BFFF', grad: 'linear-gradient(135deg, #2A2250, #10202A)', page: '#1B1920', bar: 'rgba(44,42,49,0.95)', line: '#37353C', tiles: ['#34277A', '#12404A', '#4A2A22', '#2C2A31'] },
{ name: 'Бумага', accent: '#7C5800', grad: 'linear-gradient(135deg, #F4E7CF, #EFE0D8)', page: '#FBF7F0', bar: 'rgba(255,251,244,0.95)', line: '#E6DCCB', tiles: ['#FFEBC2', '#F4DCCB', '#E9E1D0', '#FFE1D6'] },
{ name: 'Моно', accent: '#303036', grad: 'linear-gradient(135deg, #E2E2E6, #F2F2F4)', page: '#FFFFFF', bar: 'rgba(248,248,250,0.95)', line: '#DEDEE2', tiles: ['#E2E2E6', '#D6D6DA', '#EBEBEE', '#CFCFD4'] }
];
const p = presets[this.state.preset];
const onA = p.name === 'Сумерки' ? '#22106E' : '#FFFFFF';
const rs = [['Строгие', '10px', '8px', '20px', '12px'], ['Мягкие', '20px', '12px', '28px', '16px'], ['Круглые', '28px', '16px', '36px', '17px']];
const r = rs[this.state.radius];
const ds = [['Плотно', '6px'], ['Обычно', '9px'], ['Просторно', '13px']];
return {
i: window.VI || {},
accent: p.accent,
bgGrad: p.grad,
pageBg: p.page,
barBg: p.bar,
line: p.line,
soft: p.accent + '26',
tiles: p.tiles,
rPhone: r[3],
rTile: r[2],
rBar: r[4],
gap: ds[this.state.density][1],
presets: presets.map((x, n) => ({ name: x.name, swatch: x.grad, on: n === this.state.preset ? 'true' : 'false', ring: n === this.state.preset ? '0 0 0 3px var(--bg), 0 0 0 5.5px ' + x.accent : 'var(--shadow-sm)', pick: () => this.setState({ preset: n }) })),
radii: rs.map((x, n) => ({ name: x[0], shape: x[1], on: n === this.state.radius ? 'true' : 'false', bg: n === this.state.radius ? p.accent : 'var(--s-high)', fg: n === this.state.radius ? onA : 'var(--on-var)', pick: () => this.setState({ radius: n }) })),
dens: ds.map((x, n) => ({ name: x[0], on: n === this.state.density ? 'true' : 'false', bg: n === this.state.density ? p.accent : 'var(--s-high)', fg: n === this.state.density ? onA : 'var(--on-var)', pick: () => this.setState({ density: n }) }))
};
}
}
</script>
</body>
</html>
