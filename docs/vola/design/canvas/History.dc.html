<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — история</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px">
<button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button>
<span style="flex-grow: 1"></span>
<button class="ib" aria-label="Ещё"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
<h1 class="t-display" style="padding: 0 4px">История</h1>
<label style="height: 52px; border-radius: 26px; background: var(--s-high); display: flex; align-items: center; gap: 12px; padding: 0 18px; color: var(--muted)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.search}}"></path></svg><span style="position: absolute; left: -9999px">Поиск по истории</span><input type="text" placeholder="Поиск по истории" style="flex-grow: 1; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 600"></label>
<div style="display: flex; gap: 8px">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="4">
<button style="height: 36px; border-radius: 12px; padding: 0 12px 0 {{ch.pad}}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; background: {{ch.bg}}; color: {{ch.fg}}; box-shadow: {{ch.ring}}"><sc-if value="{{ch.hasIcon}}" hint-placeholder-val="{{true}}"><svg class="i xs" viewBox="0 0 24 24"><path d="{{ch.icon}}"></path></svg></sc-if>{{ch.label}}</button>
</sc-for>
</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="t-over" style="padding: 6px 4px 0">{{d.day}}</span>
<div class="group">
<sc-for list="{{d.items}}" as="h" hint-placeholder-count="3">
<a href="#" class="row" style="min-height: 64px">
<span class="mono" style="width: 36px; height: 36px; border-radius: 12px; background: {{h.tone}}; color: {{h.ink}}; font-size: 15px">{{h.l}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.title}}</span><span class="t-sub">{{h.host}}</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span class="t-sub" style="font-weight: 700">{{h.time}}</span><span style="width: 8px; height: 8px; border-radius: 4px; background: {{h.ws}}"></span></span>
</a>
</sc-for>
</div>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: linear-gradient(180deg, rgba(243,238,247,0) 0%, var(--bg) 72%)"></div>
<button style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); height: 52px; border-radius: 26px; background: var(--danger-cont); color: var(--danger); padding: 0 22px 0 18px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; box-shadow: var(--shadow)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.trash}}"></path></svg>Очистить…</button>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
const c = window.VA ? window.VA(accent) : { a: accent };
const i = window.VI || {};
return {
i: i,
c: c,
chips: [
{ label: 'Все', bg: accent, fg: '#FFFFFF', ring: 'none', pad: '12px', hasIcon: false, icon: '' },
{ label: 'Личное', bg: 'var(--surface)', fg: 'var(--on-var)', ring: 'inset 0 0 0 1px var(--outline-var)', pad: '8px', hasIcon: true, icon: i.home },
{ label: 'Работа', bg: 'var(--surface)', fg: 'var(--on-var)', ring: 'inset 0 0 0 1px var(--outline-var)', pad: '8px', hasIcon: true, icon: i.work },
{ label: 'Аниме', bg: 'var(--surface)', fg: 'var(--on-var)', ring: 'inset 0 0 0 1px var(--outline-var)', pad: '8px', hasIcon: true, icon: i.movie }
],
days: [
{ day: 'Сегодня', items: [
{ l: 'С', tone: '#2F6B5F', ink: '#FFFFFF', title: 'Байкал зимой: как выбрать маршрут', host: 'north-guide.ru', time: '14:32', ws: accent },
{ l: 'П', tone: '#D4F1EC', ink: '#00665A', title: 'Прогноз толщины льда', host: 'ice-forecast.example.ru', time: '14:05', ws: accent },
{ l: 'Д', tone: '#E6DEFF', ink: '#4A3A9E', title: 'План запуска на октябрь', host: 'docs.example.com', time: '11:40', ws: accent }
] },
{ day: 'Вчера', items: [
{ l: 'Р', tone: '#FFE1D6', ink: '#9A3A1E', title: 'Расписание сезона: осень', host: 'calendar.example.com', time: '22:18', ws: '#A23F2B' },
{ l: 'З', tone: '#FFE1D6', ink: '#9A3A1E', title: 'Спринт 42 · доска задач', host: 'tasks.example.com', time: '18:02', ws: accent },
{ l: 'К', tone: '#FFDDEA', ink: '#962F59', title: 'Каталог шрифтов с кириллицей', host: 'fonts.example.org', time: '09:47', ws: '#5E4EB7' }
] },
{ day: '27 сентября', items: [
{ l: 'О', tone: '#FFEBC2', ink: '#6E4F00', title: 'Отчёт по метрикам', host: 'metrics.example.com', time: '16:20', ws: accent },
{ l: 'К', tone: '#FFE1D6', ink: '#9A3A1E', title: 'Обзор первой серии', host: 'kinoteka.example', time: '21:05', ws: '#A23F2B' }
] }
]
};
}
}
</script>
</body>
</html>
