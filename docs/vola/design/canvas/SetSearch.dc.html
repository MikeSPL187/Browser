<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — поиск</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button><span class="t-title">Поиск</span></div>
<span class="t-over" style="padding: 4px 4px 0">Поисковая система</span>
<div class="group" role="radiogroup" aria-label="Поисковая система">
<sc-for list="{{engines}}" as="e" hint-placeholder-count="6">
<div role="radio" aria-checked="{{e.on}}" class="row" style="min-height: 58px">
<span class="mono" style="width: 34px; height: 34px; border-radius: 11px; background: {{e.tone}}; color: {{e.ink}}; font-size: 14px">{{e.l}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">{{e.name}}</span><span class="t-sub">{{e.sub}}</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 2px {{e.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{e.dot}}"></span></span>
</div>
</sc-for>
</div>
<div class="group">
<div class="row"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Подсказки поиска</span><span class="t-sub">Запрос уходит в выбранный поиск</span></span><span class="sw on" style="background: {{c.a}}"><span></span></span></div>
<div class="row"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Искать во вкладках и истории</span><span class="t-sub">Только на устройстве</span></span><span class="sw on" style="background: {{c.a}}"><span></span></span></div>
<a href="#" class="row"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Быстрые команды</span><span class="t-sub">«&gt;» в адресной строке: вкладки, пространства, настройки</span></span><svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
const e = (name, sub, l, tone, ink, on) => ({ name: name, sub: sub, l: l, tone: tone, ink: ink, on: on ? 'true' : 'false', ring: on ? accent : 'var(--outline)', dot: on ? accent : 'transparent' });
return {
i: window.VI || {},
c: window.VA ? window.VA(accent) : { a: accent },
engines: [
e('DuckDuckGo', 'Не сохраняет запросы', 'D', '#FFE1D6', '#9A3A1E', true),
e('Startpage', 'Результаты Google без слежки', 'S', '#DDE3FF', '#2F4AA8', false),
e('Brave Search', 'Собственный индекс', 'B', '#FFEBC2', '#6E4F00', false),
e('Яндекс', 'Лучше для русскоязычных запросов', 'Я', '#FFDDEA', '#962F59', false),
e('SearXNG', 'Свой сервер · search.example.org', 'X', '#D4F1EC', '#00665A', false)
]
};
}
}
</script>
</body>
</html>
