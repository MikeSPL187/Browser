<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — первая настройка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #5E4EB7"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #5E4EB7"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--outline-var)"></span></div>
<h1 class="t-h1">Настройте под себя</h1>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
<button role="radio" aria-checked="{{t.on}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="width: 100%; height: 132px; border-radius: 22px; background: {{t.bg}}; box-shadow: {{t.ring}}; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; position: relative">
<span style="height: 7px; width: 70%; border-radius: 4px; background: {{t.line}}; display: block"></span><span style="height: 36px; border-radius: 8px; background: {{t.block}}; display: block"></span><span style="height: 6px; width: 86%; border-radius: 3px; background: {{t.line}}; display: block"></span>
<span style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 20px; border-radius: 10px; background: {{t.bar}}; display: block"></span>
<sc-if value="{{t.auto}}"><span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 22px; overflow: hidden; clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); background: #1B1920; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px"><span style="height: 7px; width: 70%; border-radius: 4px; background: #37353C; display: block"></span><span style="height: 36px; border-radius: 8px; background: #2C3A40; display: block"></span><span style="height: 6px; width: 86%; border-radius: 3px; background: #37353C; display: block"></span><span style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 20px; border-radius: 10px; background: #2C2A31; display: block"></span></span></sc-if>
</span>
<span style="font-size: 14px; font-weight: 800">{{t.name}}</span>
</button>
</sc-for>
</div>
<div class="group">
<div class="row"><span class="lead" style="background: #D3F0D9; color: #2B6C3F"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.shieldCheck}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Строгая защита от трекеров</span><span class="t-sub">Включена</span></span><span class="sw on" style="background: #5E4EB7"><span></span></span></div>
<div class="row"><span class="lead" style="background: #D3F0D9; color: #2B6C3F"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.lock}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Только HTTPS</span><span class="t-sub">Включено</span></span><span class="sw on" style="background: #5E4EB7"><span></span></span></div>
<div class="row"><span class="lead" style="background: #E6DEFF; color: #4A3A9E"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.gesture}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Показать жесты</span><span class="t-sub">Короткое обучение, 30 секунд</span></span><span class="sw on" style="background: #5E4EB7"><span></span></span></div>
</div>
<div style="border-radius: 24px; background: #E6DEFF; padding: 16px; display: flex; align-items: center; gap: 14px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800; color: #22106E">Сделать Vola основным браузером</span><span style="font-size: 13px; color: #45397A">Можно позже в настройках</span></span>
<button style="height: 40px; border-radius: 20px; background: #5E4EB7; color: #FFFFFF; padding: 0 16px; font-size: 14px; font-weight: 800">Сделать</button>
</div>
</div>
<button style="position: absolute; left: 20px; right: 20px; bottom: 36px; height: 60px; border-radius: 30px; background: #5E4EB7; color: #FFFFFF; font-size: 16px; font-weight: 800; text-align: center">Далее</button>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
i: window.VI || {},
themes: [
{ name: 'Светлая', on: 'false', bg: '#FFFFFF', line: '#E1DCE6', block: '#DCE9EF', bar: '#EFE9F4', ring: 'var(--shadow-sm)' },
{ name: 'Тёмная', on: 'false', bg: '#1B1920', line: '#37353C', block: '#2C3A40', bar: '#2C2A31', ring: 'var(--shadow-sm)' },
{ name: 'Авто', on: 'true', auto: true, bg: '#FFFFFF', line: '#E1DCE6', block: '#DCE9EF', bar: '#EFE9F4', ring: '0 0 0 3px var(--bg), 0 0 0 5.5px #5E4EB7' }
]
};
}
}
</script>
</body>
</html>
