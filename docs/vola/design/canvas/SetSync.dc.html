<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — синхронизация</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button><span class="t-title">Синхронизация</span></div>
<div style="border-radius: 28px; background: {{c.a}}; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 18px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24"><path d="{{i.sync}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Связка из 2 устройств</span><span style="font-size: 13px; opacity: 0.85">5 минут назад · напрямую по Wi-Fi</span></span>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.14); border-radius: 14px; padding: 10px 12px"><svg class="i xs" viewBox="0 0 24 24"><path d="{{i.key}}"></path></svg>Сквозное шифрование. Своего сервера нет: данные идут напрямую или через вашу папку</div>
</div>
<span class="t-over" style="padding: 4px 4px 0">Устройства</span>
<div class="group">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="2">
<div class="row" style="min-height: 64px">
<span class="lead" style="background: {{d.bg}}; color: {{d.fg}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{d.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">{{d.name}}</span><span class="t-sub">{{d.sub}}</span></span>
</div>
</sc-for>
</div>
<a href="SyncPair.dc.html" style="height: 52px; border-radius: 26px; background: {{c.a14}}; color: {{c.a}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.qr}}"></path></svg>Добавить устройство</a>
<span class="t-over" style="padding: 4px 4px 0">Что синхронизировать</span>
<div class="group">
<sc-for list="{{what}}" as="w" hint-placeholder-count="5">
<div class="row" style="min-height: 54px"><span style="flex-grow: 1" class="t-label">{{w.t}}</span><span class="sw {{w.cls}}" style="background: {{w.bg}}"><span></span></span></div>
</sc-for>
</div>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BD3","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#2F5BD3';
const i = window.VI || {};
const on = (t) => ({ t: t, cls: 'on', bg: accent });
const off = (t) => ({ t: t, cls: '', bg: 'var(--s-highest)' });
return {
i: i,
c: window.VA ? window.VA(accent) : { a: accent },
devices: [
{ name: 'Этот телефон', sub: 'Vola · пространство «Работа»', icon: i.phone, bg: '#DDE3FF', fg: '#2F4AA8' },
{ name: 'Планшет', sub: 'Vola · через папку Syncthing', icon: i.desktop, bg: '#E6DEFF', fg: '#4A3A9E' }
],
what: [on('Открытые вкладки'), on('Пространства и Essentials'), on('Избранное'), on('Пароли и ключи доступа'), off('История')]
};
}
}
</script>
</body>
</html>
