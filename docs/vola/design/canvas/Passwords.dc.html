<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — пароли</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 320px; background: radial-gradient(120% 90% at 20% 0%, {{c.a14}} 0%, rgba(0,0,0,0) 70%)"></div>
<div style="position: relative; padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button>
<div style="display: flex; gap: 4px">
<button class="ib" aria-label="Генератор паролей"><svg class="i" viewBox="0 0 24 24"><path d="{{i.dice}}"></path></svg></button>
<button class="ib" aria-label="Заблокировать хранилище"><svg class="i" viewBox="0 0 24 24"><path d="{{i.lock}}"></path></svg></button>
<button class="ib" aria-label="Ещё"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
</div>
<h1 class="t-display" style="padding: 0 4px">Пароли</h1>
<label style="height: 52px; border-radius: 26px; background: var(--s-high); display: flex; align-items: center; gap: 12px; padding: 0 18px; color: var(--muted)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.search}}"></path></svg><span style="position: absolute; left: -9999px">Поиск по сайтам и логинам</span><input type="text" placeholder="Сайт или логин" style="flex-grow: 1; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 600"></label>
<a href="PasswordHealth.dc.html" style="border-radius: 24px; background: var(--surface); padding: 14px 12px 14px 14px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm)">
<span class="lead" style="width: 44px; height: 44px; background: var(--warn-cont); color: var(--warn)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.shield}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<span class="t-label" style="font-size: 15px">Проверка паролей</span>
<span style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="height: 22px; border-radius: 11px; padding: 0 8px; display: flex; align-items: center; font-size: 12px; font-weight: 800; background: var(--danger-cont); color: var(--danger)">3 утечки</span>
<span style="height: 22px; border-radius: 11px; padding: 0 8px; display: flex; align-items: center; font-size: 12px; font-weight: 800; background: var(--warn-cont); color: var(--warn)">5 повторов</span>
<span style="height: 22px; border-radius: 11px; padding: 0 8px; display: flex; align-items: center; font-size: 12px; font-weight: 800; background: var(--s-high); color: var(--on-var)">2 слабых</span>
</span>
</span>
<svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg>
</a>
<div style="display: flex; gap: 8px; margin-right: -16px; overflow: hidden">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="5">
<button style="height: 36px; border-radius: 18px; padding: 0 14px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap; font-size: 13px; font-weight: 800; background: {{ch.bg}}; color: {{ch.fg}}; box-shadow: {{ch.ring}}"><svg class="i xs" viewBox="0 0 24 24"><path d="{{ch.icon}}"></path></svg>{{ch.label}}<span style="opacity: 0.7">{{ch.count}}</span></button>
</sc-for>
</div>
<span class="t-over" style="padding: 2px 4px 0">Недавние</span>
<div class="group">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="PasswordDetail.dc.html" class="row" style="min-height: 64px">
<span class="mono" style="width: 40px; height: 40px; border-radius: 14px; background: {{it.bg}}; color: {{it.fg}}; font-size: 15px">{{it.letter}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.site}}</span><span class="t-sub" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.login}}</span></span>
<span style="display: flex; gap: 4px; align-items: center">
<sc-for list="{{it.badges}}" as="b" hint-placeholder-count="1">
<span aria-label="{{b.aria}}" style="height: 24px; min-width: 24px; border-radius: 12px; padding: 0 7px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 800; background: {{b.bg}}; color: {{b.fg}}"><sc-if value="{{b.hasIcon}}" hint-placeholder-val="{{ true }}"><svg class="i xs" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="{{b.icon}}"></path></svg></sc-if>{{b.label}}</span>
</sc-for>
</span>
</a>
</sc-for>
</div>
</div>
<button aria-label="Добавить пароль" style="position: absolute; right: 16px; bottom: 28px; width: 64px; height: 64px; border-radius: 20px; background: {{c.a}}; color: {{onA}}; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow)"><svg class="i" viewBox="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"theme":{"editor":"enum","options":["vl","vd","vo"],"default":"vl"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
const theme = this.props.theme ?? 'vl';
const c = window.VA ? window.VA(accent) : { a: accent, a14: accent };
const dark = theme !== 'vl';
const onA = dark ? '#1C1340' : '#FFFFFF';
const i = window.VI || {};
const chip = (label, count, icon, on) => ({ label: label, count: count, icon: icon, bg: on ? c.a : 'var(--surface)', fg: on ? onA : 'var(--on-var)', ring: on ? 'none' : 'inset 0 0 0 1px var(--outline-var)' });
const twoFa = { label: '2FA', aria: 'Есть код 2FA', bg: 'var(--s-high)', fg: 'var(--on-var)', hasIcon: false, icon: '' };
const passkey = { label: '', aria: 'Есть ключ доступа', bg: c.a14, fg: accent, hasIcon: true, icon: i.passkey };
const reused = { label: 'Повтор', aria: 'Пароль повторяется', bg: 'var(--warn-cont)', fg: 'var(--warn)', hasIcon: false, icon: '' };
const leaked = { label: 'Утечка', aria: 'Пароль найден в утечке', bg: 'var(--danger-cont)', fg: 'var(--danger)', hasIcon: true, icon: i.warning };
const item = (letter, site, login, bg, fg, badges) => ({ letter: letter, site: site, login: login, bg: dark ? 'rgba(255,255,255,0.08)' : bg, fg: dark ? bg : fg, badges: badges });
return {
i: i,
c: c,
theme: theme,
onA: onA,
chips: [chip('Все', '128', i.key, true), chip('Ключи доступа', '6', i.passkey, false), chip('Коды 2FA', '14', i.clock, false), chip('Карты', '2', i.card, false), chip('Заметки', '3', i.note, false)],
items: [
item('П', 'mail.example.com', 'anna@example.com', '#DDE3FF', '#2F4AA8', [passkey, twoFa]),
item('Б', 'bank.example.ru', 'anna.k', '#D3F0D9', '#2B6C3F', [passkey]),
item('З', 'tasks.example.com', 'anna@work.example', '#FFE1D6', '#9A3A1E', [reused]),
item('Ф', 'forum.example.org', 'snowfox', '#FFDDEA', '#962F59', [leaked]),
item('О', 'cloud.example.net', 'anna@example.com', '#FFEBC2', '#6E4F00', [twoFa])
]
};
}
}
</script>
</body>
</html>
