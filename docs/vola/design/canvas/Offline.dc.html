<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — нет сети</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: 50%; top: 150px; transform: translateX(-50%); width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(closest-side, {{c.a20}}, rgba(243,238,247,0))"></div>
<div style="position: relative; padding: 190px 32px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
<div style="width: 112px; height: 112px; border-radius: 40px; background: var(--surface); box-shadow: var(--shadow); color: {{c.a}}; display: flex; align-items: center; justify-content: center"><svg class="i xl" viewBox="0 0 24 24"><path d="{{i.wifiOff}}"></path></svg></div>
<h1 class="t-h1" style="padding-top: 8px">Нет подключения</h1>
<p style="font-size: 16px; line-height: 1.5; color: var(--on-var)">Страница откроется сама, как только сеть вернётся. Проверьте Wi-Fi или мобильный интернет.</p>
<div style="display: flex; gap: 10px; padding-top: 8px">
<button style="height: 52px; border-radius: 26px; background: {{c.a}}; color: #FFFFFF; padding: 0 22px 0 18px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.reload}}"></path></svg>Повторить</button>
<button style="height: 52px; border-radius: 26px; background: var(--surface); padding: 0 20px; font-size: 15px; font-weight: 800">Настройки сети</button>
</div>
</div>
<div class="glass" style="position: absolute; left: 12px; right: 12px; bottom: 24px; height: 64px; border-radius: 32px; display: flex; align-items: center; gap: 2px; padding: 0 8px">
<span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span style="width: 38px; height: 38px; border-radius: 19px; background: {{c.a}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.work}}"></path></svg></span></span>
<span style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 700">north-guide.ru</span>
<button class="ib" aria-label="Вкладки: 4"><span class="tc">4</span></button>
<button class="ib" aria-label="Меню"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
return { i: window.VI || {}, c: window.VA ? window.VA(accent) : { a: accent } };
}
}
</script>
</body>
</html>
