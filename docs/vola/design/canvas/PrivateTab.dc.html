<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — приватная вкладка</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vd" style="width: 390px; height: 844px; background: #120F20">
<div style="position: absolute; left: -120px; top: -140px; width: 620px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(109,76,255,0.42), rgba(18,15,32,0))"></div>
<div style="position: absolute; right: -200px; bottom: 80px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(closest-side, rgba(34,211,238,0.14), rgba(18,15,32,0))"></div>
<div style="position: relative; padding: 110px 28px 0; display: flex; flex-direction: column; gap: 22px">
<div style="width: 76px; height: 76px; border-radius: 26px; background: rgba(201,191,255,0.14); color: #C9BFFF; display: flex; align-items: center; justify-content: center"><svg class="i xl" viewBox="0 0 24 24"><path d="{{i.incognito}}"></path></svg></div>
<h1 class="t-display" style="color: #F1ECFF">Приватная вкладка</h1>
<p style="font-size: 16px; line-height: 1.5; color: #C9C2DD">Vola не сохранит, что вы делали здесь. Закроете вкладку — всё сотрётся.</p>
<div style="display: flex; flex-direction: column; gap: 14px; padding-top: 6px">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; align-items: flex-start">
<span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(201,191,255,0.1); color: #C9BFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i s" viewBox="0 0 24 24"><path d="{{f.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding-top: 1px"><span style="font-size: 15px; font-weight: 700; color: #F1ECFF">{{f.title}}</span><span style="font-size: 13px; line-height: 1.4; color: #A9A1C0">{{f.sub}}</span></span>
</div>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 24px; height: 64px; border-radius: 32px; background: rgba(38,32,64,0.86); box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(201,191,255,0.14); display: flex; align-items: center; gap: 2px; padding: 0 8px">
<span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span style="width: 38px; height: 38px; border-radius: 19px; background: #C9BFFF; color: #22106E; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.incognito}}"></path></svg></span></span>
<button style="flex-grow: 1; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: #A9A1C0; font-size: 16px; font-weight: 600"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.search}}"></path></svg>Поиск без следов</button>
<button class="ib" aria-label="Приватные вкладки: 1" style="color: #E7E1F5; width: 44px"><span class="tc">1</span></button>
<button class="ib" aria-label="Меню" style="color: #E7E1F5; width: 40px"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const i = window.VI || {};
return {
i: i,
facts: [
{ icon: i.history, title: 'Без истории и cookie', sub: 'Адреса, формы и входы не сохраняются' },
{ icon: i.file, title: 'Ничего на диске', sub: 'Кэш и данные сайтов живут только в памяти' },
{ icon: i.shieldCheck, title: 'Строгая защита', sub: 'Трекеры и отпечатки блокируются всегда' },
{ icon: i.download, title: 'Загрузки остаются', sub: 'Скачанные файлы и Essentials сохраняются' }
]
};
}
}
</script>
</body>
</html>
