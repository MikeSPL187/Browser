<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — страница, тёмная тема</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Literata:opsz,wght@7..72,400;7..72,600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#1A181E}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vd" style="width: 390px; height: 844px; background: #121417">
<div style="height: 96px; padding: 44px 20px 0; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #22262B">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 26px; height: 26px; border-radius: 8px; background: #5FB8A6"></span><span style="font-size: 15px; font-weight: 800; color: #D6EDE7">Северный путеводитель</span></div>
<span style="font-size: 13px; font-weight: 700; color: #5FB8A6">Маршруты</span>
</div>
<article style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5FB8A6">Зима · 12 минут чтения</div>
<h1 style="font-family: Literata, Georgia, serif; font-size: 31px; line-height: 1.15; font-weight: 600; color: #EAF2EF">Байкал зимой: как выбрать маршрут по льду</h1>
<div style="height: 200px; border-radius: 18px; background: linear-gradient(160deg, #2A3E47 0%, #1D3440 55%, #16303C 100%); display: flex; align-items: flex-end; padding: 12px"><span style="font-size: 12px; font-weight: 700; color: #CFE3EA; background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 10px">[Фото: прозрачный лёд у Ольхона]</span></div>
<p style="font-family: Literata, Georgia, serif; font-size: 17px; line-height: 1.62; color: #C9D2CF">Лёд на Байкале становится крепким к середине февраля. До этого лучше выбирать прогулки у берега и маршруты с проводником.</p>
</article>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: linear-gradient(180deg, rgba(18,20,23,0) 0%, rgba(18,20,23,0.92) 60%)"></div>
<div class="glass" style="position: absolute; left: 12px; right: 12px; bottom: 24px; height: 64px; border-radius: 32px; display: flex; align-items: center; gap: 2px; padding: 0 8px">
<button aria-label="Пространство «Работа»" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><span style="width: 38px; height: 38px; border-radius: 19px; background: {{c.a}}; color: #00363F; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.work}}"></path></svg></span></button>
<button aria-label="Сведения о сайте и адрес" style="flex-grow: 1; min-width: 0; height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg class="i xs" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.lock}}"></path></svg><span style="font-size: 16px; font-weight: 700">north-guide.ru</span></button>
<button class="ib" aria-label="Вкладки: 4"><span class="tc">4</span></button>
<button class="ib" aria-label="Меню"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#75D4E7","options":["#C9BFFF","#75D4E7","#FFB4A5","#B3C5FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#75D4E7';
return { i: window.VI || {}, c: window.VA ? window.VA(accent) : { a: accent } };
}
}
</script>
</body>
</html>
