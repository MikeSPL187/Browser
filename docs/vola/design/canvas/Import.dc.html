<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — перенос из другого браузера</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background: radial-gradient(110% 80% at 80% 0%, {{c.a14}} 0%, rgba(0,0,0,0) 70%)"></div>
<div style="position: relative; padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<h1 class="t-h1">Перенести в Vola</h1>
<p class="t-sub" style="font-size: 14px">Закладки, пароли и история переносятся на этом телефоне. Файл экспорта Vola предложит удалить сразу после импорта.</p>
</div>
<span class="t-over" style="padding: 4px 4px 0">Откуда</span>
<div class="group">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="6">
<a href="ImportChrome.dc.html" class="row" style="min-height: 64px">
<span class="mono" style="width: 40px; height: 40px; border-radius: 14px; background: {{s.bg}}; color: {{s.fg}}; font-size: 15px">{{s.letter}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">{{s.name}}</span><span class="t-sub">{{s.what}}</span></span>
<svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg>
</a>
</sc-for>
</div>
<button style="height: 56px; border-radius: 28px; box-shadow: inset 0 0 0 1px var(--outline-var); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.file}}"></path></svg>У меня уже есть файл</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
const s = (letter, name, what, bg, fg) => ({ letter: letter, name: name, what: what, bg: bg, fg: fg });
return {
i: window.VI || {},
c: window.VA ? window.VA(accent) : { a: accent, a14: accent },
sources: [
s('C', 'Chrome', 'Пароли (CSV) и закладки (HTML)', '#DDE3FF', '#2F4AA8'),
s('F', 'Firefox', 'Пароли и закладки с компьютера', '#FFE1D6', '#9A3A1E'),
s('S', 'Samsung Internet', 'Закладки (HTML)', '#E6DEFF', '#4A3A9E'),
s('B', 'Bitwarden, Proton Pass, 1Password', 'Пароли, коды 2FA, карты (CSV, JSON)', '#D4F1EC', '#00665A'),
s('K', 'KeePass', 'Файл .kdbx целиком, с группами', '#D3F0D9', '#2B6C3F'),
s('V', 'Другая копия Vola', 'Архив данных или связка устройств', '#FFEBC2', '#6E4F00')
]
};
}
}
</script>
</body>
</html>
