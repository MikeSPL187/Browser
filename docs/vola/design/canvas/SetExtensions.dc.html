<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — расширения</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button><span class="t-title">Расширения</span></div>
<div style="border-radius: 28px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 18px; background: #7A1F1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i" viewBox="0 0 24 24"><path d="{{i.shield}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">uBlock Origin</span><span class="t-sub">Блокировщик рекламы · встроен</span></span>
<span class="sw on" style="background: {{c.a}}"><span></span></span>
</div>
<div style="display: flex; gap: 8px">
<button style="height: 40px; border-radius: 20px; background: {{c.a14}}; color: {{c.a}}; padding: 0 14px; font-size: 13px; font-weight: 800">Настроить</button>
<button style="height: 40px; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--outline-var); padding: 0 14px; font-size: 13px; font-weight: 800">Разрешения</button>
</div>
</div>
<span class="t-over" style="padding: 4px 4px 0">Установлены</span>
<div class="group">
<sc-for list="{{ext}}" as="e" hint-placeholder-count="2">
<div class="row" style="min-height: 68px">
<span class="lead" style="background: {{e.bg}}; color: {{e.fg}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{e.icon}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">{{e.name}}</span><span class="t-sub">{{e.sub}}</span></span>
<span class="sw on" style="background: {{c.a}}"><span></span></span>
</div>
</sc-for>
</div>
<div class="group">
<a href="#" class="row"><span class="lead" style="background: var(--s-high); color: var(--on-var)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.code}}"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Пользовательские скрипты</span><span class="t-sub">2 скрипта</span></span><svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg></a>
</div>
<button style="height: 56px; border-radius: 28px; background: {{c.a}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.puzzle}}"></path></svg>Найти расширения Firefox</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
const i = window.VI || {};
return {
i: i,
c: window.VA ? window.VA(accent) : { a: accent },
ext: [
{ name: '[Менеджер паролей]', sub: 'Установлено из каталога Firefox', icon: i.key, bg: '#DDE3FF', fg: '#2F4AA8' },
{ name: '[Тёмные страницы]', sub: 'Работает в пространстве «Аниме»', icon: i.moon, bg: '#E6DEFF', fg: '#4A3A9E' }
]
};
}
}
</script>
</body>
</html>
