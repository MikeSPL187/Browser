<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — приватность и защита</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button><span class="t-title">Приватность и защита</span></div>
<div style="border-radius: 28px; background: linear-gradient(135deg, #D3F0D9, #D4F1EC); padding: 18px; display: flex; align-items: center; gap: 16px">
<span style="width: 60px; height: 60px; border-radius: 22px; background: #2B6C3F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg class="i l" viewBox="0 0 24 24"><path d="{{i.shieldCheck}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 19px; font-weight: 800; color: #12351F">Вы под защитой</span><span style="font-size: 13px; font-weight: 600; color: #2B4A35">За неделю заблокировано 1 284 трекера на 96 сайтах</span></span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="t-over" style="padding: 4px 4px 0">Защита от трекеров</span>
<div role="radiogroup" style="display: flex; gap: 4px">
<button role="radio" aria-checked="false" style="flex: 1; height: 64px; border-radius: 28px 10px 10px 28px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 800">Обычная</span><span class="t-sub" style="font-size: 11px">меньше поломок</span></button>
<button role="radio" aria-checked="true" style="flex: 1; height: 64px; border-radius: 10px; background: #2B6C3F; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 800">Строгая</span><span style="font-size: 11px; font-weight: 600; opacity: 0.85">по умолчанию</span></button>
<button role="radio" aria-checked="false" style="flex: 1; height: 64px; border-radius: 10px 28px 28px 10px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 800">Своя</span><span class="t-sub" style="font-size: 11px">Filter Studio</span></button>
</div>
</div>
<div class="group">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<a href="#" class="row" style="min-height: 62px">
<span class="lead" style="background: var(--s-high); color: var(--on-var)"><svg class="i s" viewBox="0 0 24 24"><path d="{{r.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">{{r.title}}</span><span class="t-sub">{{r.sub}}</span></span>
<sc-if value="{{r.sw}}" hint-placeholder-val="{{false}}"><span class="sw on" style="background: #2B6C3F"><span></span></span></sc-if>
</a>
</sc-for>
</div>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const i = window.VI || {};
const r = (icon, title, sub, sw) => ({ icon: icon, title: title, sub: sub, sw: sw });
return {
i: i,
rows: [
r(i.lock, 'Только HTTPS', 'Всегда · предупреждать перед http', false),
r(i.cookie, 'Скрывать cookie-баннеры', 'Отказываться от необязательных cookie', true),
r(i.dns, 'Защищённый DNS', 'Выключен · выбрать сервер', false),
r(i.fingerprint, 'Защита от отпечатков', 'Сайтам сложнее вас узнать', true),
r(i.eye, 'Просить не отслеживать (GPC)', 'Сигнал сайтам в каждом запросе', true),
r(i.trash, 'Очищать при выходе', 'История и cookie · выбрать', false)
]
};
}
}
</script>
</body>
</html>
