<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — только HTTPS</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: -120px; top: -100px; width: 560px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(247,189,72,0.35), rgba(243,238,247,0))"></div>
<div style="position: relative; padding: 130px 28px 0; display: flex; flex-direction: column; gap: 18px">
<div style="width: 88px; height: 88px; border-radius: 30px; background: var(--warn-cont); color: var(--warn); display: flex; align-items: center; justify-content: center"><svg class="i xl" viewBox="0 0 24 24" style="width: 40px; height: 40px"><path d="{{i.lockOpen}}"></path></svg></div>
<h1 class="t-h1">У сайта нет защищённой версии</h1>
<p style="font-size: 16px; line-height: 1.55; color: var(--on-var)">Vola открывает сайты только по HTTPS. <b style="color: var(--on)">neverssl.com</b> не поддерживает защищённое соединение: всё, что вы здесь увидите или введёте, могут прочитать или подменить по пути.</p>
<div style="border-radius: 20px; background: var(--surface); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
<svg class="i s" viewBox="0 0 24 24" style="color: var(--muted); margin-top: 1px"><path d="{{i.info}}"></path></svg>
<span class="t-sub" style="font-size: 14px">Не вводите на таком сайте пароли и данные карт.</span>
</div>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 36px; display: flex; flex-direction: column; gap: 8px">
<button style="height: 60px; border-radius: 30px; background: {{c.a}}; color: #FFFFFF; font-size: 16px; font-weight: 800; text-align: center">Вернуться назад</button>
<button style="height: 52px; border-radius: 26px; font-size: 15px; font-weight: 800; color: var(--on-var); text-align: center">Всё равно открыть по HTTP</button>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
return { i: window.VI || {}, c: window.VA ? window.VA(accent) : { a: accent } };
}
}
</script>
</body>
</html>
