<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — Privacy X-Ray</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: -140px; top: -180px; width: 640px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, {{c.a30}}, rgba(243,238,247,0))"></div>
<div style="position: relative; padding: 50px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px">
<button class="ib" aria-label="Назад" style="background: rgba(255,255,255,0.7)"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button>
<span class="t-title">Privacy X-Ray</span>
</div>
<div style="border-radius: 28px; background: var(--surface); box-shadow: var(--shadow-sm); padding: 20px; display: flex; align-items: center; gap: 18px">
<div style="width: 96px; height: 96px; border-radius: 48px; background: conic-gradient({{c.a}} 0 43%, #7C5800 43% 79%, #A0305B 79% 93%, #2F5BD3 93% 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<div style="width: 70px; height: 70px; border-radius: 35px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 26px; font-weight: 800; line-height: 1">14</span><span style="font-size: 11px; font-weight: 700; color: var(--muted)">запросов</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="t-title">Заблокировано на north-guide.ru</span>
<span class="t-sub">Без них страница грузится быстрее и не передаёт сведения о вас</span>
</div>
</div>
<div style="border-radius: 24px; background: var(--surface); padding: 8px 16px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="4">
<div style="height: 52px; display: flex; align-items: center; gap: 12px">
<span style="width: 12px; height: 12px; border-radius: 4px; background: {{k.color}}; flex-shrink: 0"></span>
<span style="width: 112px; font-size: 15px; font-weight: 700">{{k.name}}</span>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: var(--s-high); overflow: hidden"><div style="width: {{k.w}}; height: 8px; border-radius: 4px; background: {{k.color}}"></div></div>
<span style="width: 20px; text-align: right; font-size: 15px; font-weight: 800">{{k.n}}</span>
</div>
</sc-for>
</div>
<span class="t-over" style="padding: 4px 4px 0">Кому страница пыталась отправить данные</span>
<div class="group">
<sc-for list="{{hosts}}" as="h" hint-placeholder-count="4">
<div class="row" style="min-height: 56px">
<span class="lead" style="width: 36px; height: 36px; border-radius: 12px; background: var(--s-high); color: var(--on-var)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.block}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{h.host}}</span><span class="t-sub">{{h.kind}}</span></span>
<span style="font-size: 13px; font-weight: 800; color: var(--muted)">×{{h.n}}</span>
</div>
</sc-for>
</div>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
return {
i: window.VI || {},
c: window.VA ? window.VA(accent) : { a: accent },
cats: [
{ name: 'Реклама', n: 6, w: '100%', color: accent },
{ name: 'Аналитика', n: 5, w: '83%', color: '#7C5800' },
{ name: 'Соцсети', n: 2, w: '33%', color: '#A0305B' },
{ name: 'Отпечатки', n: 1, w: '17%', color: '#2F5BD3' }
],
hosts: [
{ host: 'ads.example-network.com', kind: 'Реклама', n: 4 },
{ host: 'metrics.example.net', kind: 'Аналитика', n: 3 },
{ host: 'pixel.example-social.com', kind: 'Соцсети', n: 2 },
{ host: 'fp.example-cdn.com', kind: 'Снятие отпечатка', n: 1 }
]
};
}
}
</script>
</body>
</html>
