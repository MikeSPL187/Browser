<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — действия с вкладкой</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; inset: 0; padding: 50px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; filter: blur(6px); opacity: 0.7">
<div style="height: 52px; grid-column: span 2; border-radius: 26px; background: rgba(255,255,255,0.7)"></div>
<div style="height: 196px; border-radius: 24px; background: #FFFFFF"></div><div style="height: 196px; border-radius: 24px; background: #FFFFFF"></div>
<div style="height: 196px; border-radius: 24px; background: #FFFFFF"></div><div style="height: 196px; border-radius: 24px; background: #FFFFFF"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(243,238,247,0.35)"></div>
<div style="position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 236px; display: flex; flex-direction: column; gap: 10px; align-items: center">
<div style="width: 236px; height: 300px; border-radius: 28px; background: var(--surface); box-shadow: 0 0 0 3px {{c.a}}, 0 24px 48px rgba(38,22,86,0.22); padding: 14px; display: flex; flex-direction: column; gap: 9px">
<div style="height: 18px; width: 46%; border-radius: 6px; background: #9A3A1E"></div>
<div style="height: 110px; border-radius: 16px; background: #FFE1D6"></div>
<div style="height: 9px; width: 92%; border-radius: 4px; background: #E6E1EB"></div>
<div style="height: 9px; width: 70%; border-radius: 4px; background: #E6E1EB"></div>
<div style="height: 9px; width: 84%; border-radius: 4px; background: #E6E1EB"></div>
</div>
<span class="t-label">Спринт 42 · доска задач</span>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 440px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px 0 8px; border-bottom: 1px solid var(--hair)">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button style="height: 68px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--on-var); font-size: 12px; font-weight: 700"><svg class="i" viewBox="0 0 24 24"><path d="{{q.icon}}"></path></svg>{{q.label}}</button>
</sc-for>
</div>
<sc-for list="{{items}}" as="m" hint-placeholder-count="5">
<button style="height: 52px; border-radius: 16px; display: flex; align-items: center; gap: 14px; padding: 0 14px; color: {{m.color}}">
<svg class="i" viewBox="0 0 24 24"><path d="{{m.icon}}"></path></svg>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{m.label}}</span>
<span class="t-sub">{{m.hint}}</span>
</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
const i = window.VI || {};
return {
i: i,
c: window.VA ? window.VA(accent) : { a: accent },
quick: [
{ icon: i.star, label: 'Essentials' },
{ icon: i.copy, label: 'Копия' },
{ icon: i.split, label: 'Рядом' },
{ icon: i.share, label: 'Отправить' }
],
items: [
{ icon: i.swap, label: 'Переместить в пространство', hint: '›', color: 'var(--on)' },
{ icon: i.stack, label: 'Добавить в стопку', hint: '', color: 'var(--on)' },
{ icon: i.alarm, label: 'Отложить', hint: 'до завтра', color: 'var(--on)' },
{ icon: i.close, label: 'Закрыть вкладку', hint: '', color: 'var(--danger)' }
]
};
}
}
</script>
</body>
</html>
