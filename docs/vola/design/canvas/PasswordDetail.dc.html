<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — запись в хранилище</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Passwords.dc.html" class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></a>
<div style="display: flex; gap: 4px">
<button class="ib" aria-label="Изменить"><svg class="i" viewBox="0 0 24 24"><path d="{{i.edit}}"></path></svg></button>
<button class="ib" aria-label="Ещё"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 0 4px">
<span class="mono" style="width: 56px; height: 56px; border-radius: 18px; background: #DDE3FF; color: #2F4AA8; font-size: 22px">П</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span class="t-h2">Почта</span><span class="t-sub">mail.example.com</span></span>
</div>
<div style="border-radius: 20px; background: var(--warn-cont); color: var(--warn); padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
<svg class="i s" viewBox="0 0 24 24"><path d="{{i.warning}}"></path></svg>
<span style="flex-grow: 1; font-size: 13px; font-weight: 700; line-height: 1.35">Этот пароль есть ещё на 2 сайтах</span>
<button style="height: 36px; border-radius: 18px; padding: 0 14px; background: var(--warn); color: var(--warn-cont); font-size: 13px; font-weight: 800; white-space: nowrap">Сменить</button>
</div>
<div class="group">
<div class="row" style="min-height: 68px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span class="t-sub">Логин</span><span style="font-size: 16px; font-weight: 700">anna@example.com</span></span>
<button class="ib" aria-label="Копировать логин" style="width: 44px; height: 44px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.copy}}"></path></svg></button>
</div>
<div class="row" style="min-height: 68px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span class="t-sub">Пароль</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.12em">••••••••••••</span></span>
<button class="ib" aria-label="Показать пароль" style="width: 44px; height: 44px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.eye}}"></path></svg></button>
<button class="ib" aria-label="Копировать пароль" style="width: 44px; height: 44px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.copy}}"></path></svg></button>
</div>
<div class="row" style="min-height: 68px">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span class="t-sub">Код 2FA</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: {{c.a}}">482 913</span></span>
<span aria-label="Код обновится через 18 секунд" style="width: 36px; height: 36px; border-radius: 18px; background: conic-gradient({{c.a}} 0 60%, var(--s-high) 60% 100%); display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">18</span></span>
<button class="ib" aria-label="Копировать код" style="width: 44px; height: 44px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.copy}}"></path></svg></button>
</div>
</div>
<div class="group">
<div class="row" style="min-height: 64px">
<span class="lead" style="background: {{c.a14}}; color: {{c.a}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.passkey}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Ключ доступа</span><span class="t-sub">Вход без пароля · на этом телефоне</span></span>
</div>
<div class="row" style="min-height: 64px">
<span class="lead" style="background: var(--s-high); color: var(--on-var)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.globe}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Сайты</span><span class="t-sub">mail.example.com, accounts.example.com</span></span>
</div>
<div class="row" style="min-height: 64px">
<span class="lead" style="background: var(--s-high); color: var(--on-var)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.history}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">История пароля</span><span class="t-sub">Изменён 12 марта · 2 прошлых версии</span></span>
<svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg>
</div>
</div>
<button style="height: 48px; border-radius: 24px; color: var(--danger); font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.trash}}"></path></svg>Удалить запись</button>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
return {
i: window.VI || {},
c: window.VA ? window.VA(accent) : { a: accent, a14: accent }
};
}
}
</script>
</body>
</html>
