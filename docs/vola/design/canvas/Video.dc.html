<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — видео и картинка в картинке</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--page)">
<div style="height: 96px; padding: 44px 20px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #EEF0F2"><span style="width: 26px; height: 26px; border-radius: 8px; background: #A23F2B"></span><span style="font-size: 15px; font-weight: 800; color: #3A1A12">Кинотека</span></div>
<div style="margin: 16px 0 0; height: 219px; background: linear-gradient(135deg, #3B2A5E 0%, #7A3E4F 55%, #D08A5C 100%); position: relative; display: flex; align-items: center; justify-content: center">
<span style="width: 64px; height: 64px; border-radius: 32px; background: rgba(0,0,0,0.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i l" viewBox="0 0 24 24"><path d="{{i.pause}}"></path></svg></span>
<span style="position: absolute; left: 12px; right: 12px; bottom: 10px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #FFFFFF 0 38%, rgba(255,255,255,0.35) 38% 100%)"></span>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 19px; font-weight: 800; color: #1C1B20">Обзор первой серии</span><span style="font-size: 13px; color: #625D6B">24 мин · субтитры</span></div>
<div style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div class="sheet" style="height: 420px; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px">
<div class="handle"></div>
<span class="t-title" style="padding: 4px 4px 0">Видео</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 96px; border-radius: 24px; background: {{c.a}}; color: #FFFFFF; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left"><svg class="i" viewBox="0 0 24 24"><path d="{{i.pip}}"></path></svg><span style="font-size: 14px; font-weight: 800; line-height: 1.2">Картинка в картинке</span></button>
<button style="height: 96px; border-radius: 24px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left"><svg class="i" viewBox="0 0 24 24" style="color: var(--on-var)"><path d="{{i.speaker}}"></path></svg><span style="font-size: 14px; font-weight: 800; line-height: 1.2">Только звук в фоне</span></button>
</div>
<div class="group">
<div class="row" style="min-height: 60px"><svg class="i" viewBox="0 0 24 24" style="color: var(--on-var)"><path d="{{i.speed}}"></path></svg><span class="t-label" style="flex-grow: 1; font-size: 15px">Скорость</span>
<div style="display: flex; gap: 4px">
<sc-for list="{{speeds}}" as="s" hint-placeholder-count="4"><button style="height: 36px; min-width: 48px; border-radius: 18px; padding: 0 8px; font-size: 13px; font-weight: 800; background: {{s.bg}}; color: {{s.fg}}">{{s.v}}</button></sc-for>
</div>
</div>
<div class="row" style="min-height: 60px"><svg class="i" viewBox="0 0 24 24" style="color: var(--on-var)"><path d="{{i.pip}}"></path></svg><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Окно при выходе из Vola</span><span class="t-sub">Видео продолжится поверх других приложений</span></span><span class="sw on" style="background: {{c.a}}"><span></span></span></div>
<div class="row" style="min-height: 60px"><svg class="i" viewBox="0 0 24 24" style="color: var(--on-var)"><path d="{{i.mute}}"></path></svg><span class="t-label" style="flex-grow: 1; font-size: 15px">Без звука на этом сайте</span><span class="sw"><span></span></span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A23F2B","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#A23F2B';
const c = window.VA ? window.VA(accent) : { a: accent, a14: accent };
const sp = (v, on) => ({ v: v, bg: on ? c.a14 : 'transparent', fg: on ? accent : 'var(--on-var)' });
return {
i: window.VI || {},
c: c,
speeds: [sp('1×', false), sp('1,25×', true), sp('1,5×', false), sp('2×', false)]
};
}
}
</script>
</body>
</html>
