<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — проверка паролей</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><a href="Passwords.dc.html" class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></a><span class="t-title">Проверка паролей</span></div>
<div style="border-radius: 28px; background: var(--surface); padding: 18px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-sm)">
<span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 38px; flex-shrink: 0; background: conic-gradient(var(--danger) 0 12%, var(--warn) 12% 31%, var(--outline) 31% 39%, {{c.a}} 39% 100%); display: flex; align-items: center; justify-content: center"><span style="width: 58px; height: 58px; border-radius: 29px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 20px; font-weight: 800; line-height: 1">10</span><span style="font-size: 10px; font-weight: 700; color: var(--muted)">проблем</span></span></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span class="t-title">Начните с утечек</span><span class="t-sub">Их пароли уже есть у злоумышленников. Остальные 118 записей в порядке.</span></span>
</div>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 0">
<span style="width: 28px; height: 28px; border-radius: 10px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center"><svg class="i xs" viewBox="0 0 24 24"><path d="{{s.icon}}"></path></svg></span>
<span class="t-label" style="flex-grow: 1; font-size: 15px">{{s.title}}</span>
<span class="t-sub" style="font-weight: 800">{{s.count}}</span>
</div>
<div class="group">
<sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
<div class="row" style="min-height: 62px">
<span class="mono" style="width: 36px; height: 36px; border-radius: 12px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px">{{r.letter}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span class="t-label">{{r.site}}</span><span class="t-sub">{{r.sub}}</span></span>
<button style="height: 36px; border-radius: 18px; padding: 0 14px; background: {{c.a14}}; color: {{c.a}}; font-size: 13px; font-weight: 800; white-space: nowrap">Сменить</button>
</div>
</sc-for>
</div>
</div>
</sc-for>
<div style="border-radius: 20px; background: var(--s-high); padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
<svg class="i s" viewBox="0 0 24 24" style="color: var(--on-var); margin-top: 1px"><path d="{{i.info}}"></path></svg>
<span style="font-size: 12px; line-height: 1.45; font-weight: 600; color: var(--on-var)">Проверка утечек анонимна: на сервер уходят только первые 5 символов хеша пароля. Её можно выключить в настройках.</span>
</div>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
const i = window.VI || {};
const r = (letter, site, sub, bg, fg) => ({ letter: letter, site: site, sub: sub, bg: bg, fg: fg });
return {
i: i,
c: window.VA ? window.VA(accent) : { a: accent, a14: accent },
sections: [
{ title: 'Найдены в утечках', count: '3', icon: i.warning, bg: 'var(--danger-cont)', fg: 'var(--danger)', rows: [
r('Ф', 'forum.example.org', 'snowfox · утечка 2024 года', '#FFDDEA', '#962F59'),
r('Р', 'recipes.example.com', 'anna@example.com', '#D4F1EC', '#00665A')
] },
{ title: 'Повторяются', count: '5', icon: i.copy, bg: 'var(--warn-cont)', fg: 'var(--warn)', rows: [
r('З', 'tasks.example.com', 'Такой же, как на 2 сайтах', '#FFE1D6', '#9A3A1E')
] },
{ title: 'Слабые', count: '2', icon: i.key, bg: 'var(--s-highest)', fg: 'var(--on-var)', rows: [
r('К', 'cinema.example.ru', '8 символов, только цифры', '#E6DEFF', '#4A3A9E')
] }
]
};
}
}
</script>
</body>
</html>
