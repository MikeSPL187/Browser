<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — перенос из Chrome</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><a href="Import.dc.html" class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></a><span class="t-title">Перенос из Chrome</span></div>
<div class="group" style="padding: 6px 0">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; padding: 12px 16px">
<span style="width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{s.n}}</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span class="t-label" style="font-size: 15px">{{s.title}}</span><span class="t-sub">{{s.sub}}</span></span>
</div>
</sc-for>
</div>
<div style="border-radius: 28px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-sm)">
<div style="display: flex; align-items: center; gap: 12px">
<span class="lead" style="background: var(--ok-cont); color: var(--ok)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.check}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span class="t-title">Готово</span><span class="t-sub">Chrome Passwords.csv · 38 КБ</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{stats}}" as="st" hint-placeholder-count="3">
<div style="border-radius: 18px; background: var(--s); padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800">{{st.n}}</span><span class="t-sub" style="font-size: 12px">{{st.label}}</span></div>
</sc-for>
</div>
<div style="border-radius: 18px; background: var(--warn-cont); color: var(--warn); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
<svg class="i s" viewBox="0 0 24 24"><path d="{{i.warning}}"></path></svg>
<span style="font-size: 13px; font-weight: 700; line-height: 1.4">В файле пароли лежат открытым текстом. Удалите его из «Загрузок».</span>
</div>
<div style="display: flex; gap: 8px">
<button style="flex: 1; height: 52px; border-radius: 26px; background: var(--danger); color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.trash}}"></path></svg>Удалить файл</button>
<a href="Passwords.dc.html" style="flex: 1; height: 52px; border-radius: 26px; background: {{c.a14}}; color: {{c.a}}; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center">К паролям</a>
</div>
</div>
<a href="PasswordHealth.dc.html" style="border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-sm); padding: 14px 12px 14px 16px; display: flex; align-items: center; gap: 14px">
<span class="lead" style="background: var(--warn-cont); color: var(--warn)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.shield}}"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Проверить перенесённые</span><span class="t-sub">3 пароля в утечках, 5 повторяются</span></span>
<svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg>
</a>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
const c = window.VA ? window.VA(accent) : { a: accent, a14: accent };
const done = { bg: 'var(--ok-cont)', fg: 'var(--ok)' };
return {
i: window.VI || {},
c: c,
steps: [
Object.assign({ n: '1', title: 'Откройте Chrome → Менеджер паролей', sub: 'Настройки → Экспортировать пароли' }, done),
Object.assign({ n: '2', title: 'Закладки — с компьютера', sub: 'chrome://bookmarks → ⋮ → Экспорт закладок (HTML)' }, done),
{ n: '3', title: 'Вернитесь в Vola и выберите файлы', sub: 'Дубликаты Vola пропустит сама', bg: c.a, fg: '#FFFFFF' }
],
stats: [
{ n: '86', label: 'паролей' },
{ n: '214', label: 'закладок' },
{ n: '12', label: 'дубликатов пропущено' }
]
};
}
}
</script>
</body>
</html>
