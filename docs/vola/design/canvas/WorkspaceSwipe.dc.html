<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — переключение пространств</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}
.ws-card{height:196px;border-radius:24px;background:#FFFFFF;box-shadow:var(--shadow-sm);overflow:hidden;position:relative;padding:12px;display:flex;flex-direction:column;gap:6px}
.ws-ess{height:60px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center}
.ws-lab{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: linear-gradient(100deg, #D9EEEE 0%, #F4ECEF 42%, #F8E2DB 100%)">
<div style="position: absolute; right: -160px; top: -120px; width: 560px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(162,63,43,0.18), rgba(248,226,219,0))"></div>
<div aria-hidden="true" style="position: absolute; left: 50%; top: 54px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #5E4EB7; opacity: 0.35"></span>
<span style="width: 12px; height: 8px; border-radius: 4px; background: #006877; opacity: 0.55"></span>
<span style="width: 26px; height: 8px; border-radius: 4px; background: #A23F2B"></span>
</div>
<div style="position: absolute; top: 80px; left: -302px; width: 732px; display: flex; gap: 16px">
<div aria-hidden="true" style="width: 358px; display: flex; flex-direction: column; gap: 16px; opacity: 0.5; transform: scale(0.95); transform-origin: right center">
<div style="display: flex; align-items: center; gap: 10px; height: 44px"><span style="width: 40px; height: 40px; border-radius: 20px; background: #006877; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.work}}"></path></svg></span><span class="t-h1">Работа</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px"><i class="ws-ess"></i><i class="ws-ess"></i><i class="ws-ess"></i><i class="ws-ess"></i><i class="ws-ess"><span class="mono" style="width: 30px; height: 30px; border-radius: 10px; background: #D8EEFF; color: #1E5E8C; font-size: 14px">Ч</span></i></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<div class="ws-card"><i style="height: 60px; border-radius: 12px; background: #E6DEFF"></i><span class="mp-l" style="width: 90%"></span><span class="mp-l" style="width: 70%"></span></div>
<div class="ws-card" style="flex-direction: row; align-items: flex-start"><i style="flex: 1; height: 90px; border-radius: 10px; background: #FFE1D6"></i><i style="flex: 1; height: 120px; border-radius: 10px; background: #E6DEFF"></i><i style="flex: 1; height: 70px; border-radius: 10px; background: #D4F1EC"></i></div>
</div>
</div>
<div style="width: 358px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px; height: 44px"><span style="width: 40px; height: 40px; border-radius: 20px; background: #A23F2B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(162,63,43,0.35)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.movie}}"></path></svg></span><span class="t-h1">Аниме</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ess}}" as="e" hint-placeholder-count="5"><a href="#" class="ws-ess" aria-label="{{e.name}}"><span class="mono" style="width: 30px; height: 30px; border-radius: 10px; background: {{e.tone}}; color: {{e.ink}}; font-size: 14px">{{e.l}}</span></a></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="ws-card" style="background: #16131F; box-shadow: 0 0 0 3px #A23F2B, 0 8px 20px rgba(162,63,43,0.3)">
<div class="mp-head"><i style="background: #A23F2B"></i><span class="mp-l" style="width: 40%; background: rgba(255,255,255,0.18)"></span></div>
<span style="position: relative; height: 84px; border-radius: 12px; margin-top: 2px; background: linear-gradient(160deg, #1F1838 0%, #4A2A55 45%, #9A4E55 75%, #D9905C 100%); display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(0,0,0,0.4); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i xs" viewBox="0 0 24 24"><path d="{{i.play}}"></path></svg></span><i style="position: absolute; left: 8px; right: 8px; bottom: 7px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #FFFFFF 0 34%, rgba(255,255,255,0.35) 34% 100%)"></i></span>
<span class="mp-t" style="width: 78%; background: #FFFFFF; opacity: 0.85; margin-top: 4px"></span>
<span class="mp-l" style="width: 54%; background: rgba(255,255,255,0.2)"></span>
<span style="display: flex; gap: 5px; margin-top: 4px"><i style="width: 38px; height: 22px; border-radius: 6px; background: #3A2448"></i><i style="width: 38px; height: 22px; border-radius: 6px; background: #4A2A22"></i><i style="width: 38px; height: 22px; border-radius: 6px; background: #16384A"></i></span>
</div>
<span class="ws-lab"><span class="mono" style="width: 18px; height: 18px; border-radius: 6px; background: #A23F2B; color: #FFFFFF; font-size: 10px">К</span>Обзор первой серии</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="ws-card">
<div class="mp-head"><i style="background: #6B2C8C"></i><span class="mp-l" style="width: 44%"></span></div>
<span class="mp-t" style="width: 66%; margin-top: 4px"></span>
<sc-for list="{{list}}" as="r" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 7px"><i style="width: 22px; height: 28px; border-radius: 5px; background: {{r}}; flex-shrink: 0"></i><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span class="mp-l" style="width: 88%; height: 5px"></span><span class="mp-l" style="width: 52%; height: 5px"></span></span></span></sc-for>
</div>
<span class="ws-lab"><span class="mono" style="width: 18px; height: 18px; border-radius: 6px; background: #6B2C8C; color: #FFFFFF; font-size: 10px">С</span>Список к просмотру</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="ws-card">
<div class="mp-head"><i style="background: #1E5E8C"></i><span class="mp-l" style="width: 40%"></span></div>
<span class="mp-t" style="width: 70%; margin-top: 4px"></span>
<span style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 4px">
<sc-for list="{{cal}}" as="d" hint-placeholder-count="21"><i style="height: 18px; border-radius: 5px; background: {{d}}"></i></sc-for>
</span>
<span class="mp-l" style="width: 84%; margin-top: 4px"></span>
<span class="mp-l" style="width: 60%"></span>
</div>
<span class="ws-lab"><span class="mono" style="width: 18px; height: 18px; border-radius: 6px; background: #1E5E8C; color: #FFFFFF; font-size: 10px">Р</span>Расписание сезона: осень</span>
</div>
</div>
</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 10px">
<div class="glass" style="flex-grow: 1; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; position: relative; overflow: hidden">
<button class="ib" aria-label="Приватные вкладки"><svg class="i" viewBox="0 0 24 24"><path d="{{i.incognito}}"></path></svg></button>
<button class="ib" aria-label="Вид: сетка" style="background: rgba(162,63,43,0.12); color: #A23F2B"><svg class="i" viewBox="0 0 24 24"><path d="{{i.grid}}"></path></svg></button>
<button class="ib" aria-label="Недавно закрытые"><svg class="i" viewBox="0 0 24 24"><path d="{{i.undo}}"></path></svg></button>
<button class="ib" aria-label="Ещё"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
<button aria-label="Новая вкладка" style="width: 64px; height: 64px; border-radius: 22px; background: #A23F2B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(162,63,43,0.35)"><svg class="i l" viewBox="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
i: window.VI || {},
ess: [
{ name: 'Кинотека', l: 'К', tone: '#FFE1D6', ink: '#9A3A1E' },
{ name: 'Список', l: 'С', tone: '#F1DEFA', ink: '#6B2C8C' },
{ name: 'Расписание', l: 'Р', tone: '#D8EEFF', ink: '#1E5E8C' },
{ name: 'Форум', l: 'Ф', tone: '#FFE9B8', ink: '#7C5800' },
{ name: 'Субтитры', l: 'Т', tone: '#D4F1EC', ink: '#00665A' }
],
list: ['#3A2448', '#9A4E55', '#16384A', '#4A2A22'],
cal: ['#EEF3F8', '#EEF3F8', '#D8EEFF', '#EEF3F8', '#EEF3F8', '#EEF3F8', '#EEF3F8', '#EEF3F8', '#1E5E8C', '#EEF3F8', '#EEF3F8', '#D8EEFF', '#EEF3F8', '#EEF3F8', '#EEF3F8', '#EEF3F8', '#EEF3F8', '#D8EEFF', '#EEF3F8', '#EEF3F8', '#EEF3F8']
};
}
}
</script>
</body>
</html>
