<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — вкладки и жесты</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="padding: 44px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 4px"><button class="ib" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="{{i.back}}"></path></svg></button><span class="t-title">Вкладки и жесты</span></div>
<div style="height: 200px; border-radius: 28px; background: linear-gradient(160deg, {{c.a20}}, rgba(94,78,183,0.12)); position: relative; overflow: hidden">
<div style="position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 150px; height: 200px; border-radius: 24px; background: #FFFFFF; box-shadow: var(--shadow-sm); padding: 14px 12px; display: flex; flex-direction: column; gap: 7px">
<div style="height: 8px; width: 70%; border-radius: 4px; background: #D8D2DE"></div><div style="height: 50px; border-radius: 10px; background: #DCE9EF"></div><div style="height: 6px; width: 90%; border-radius: 3px; background: #E6E1EB"></div><div style="height: 6px; width: 76%; border-radius: 3px; background: #E6E1EB"></div>
</div>
<div class="glass" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: 170px; height: 40px; border-radius: 20px; display: flex; align-items: center; padding: 0 6px; gap: 6px"><span style="width: 28px; height: 28px; border-radius: 14px; background: {{c.a}}"></span><span style="height: 7px; width: 72px; border-radius: 4px; background: #CAC4D0"></span></div>
<svg class="i" viewBox="0 0 24 24" style="position: absolute; left: 34px; bottom: 28px; color: {{c.a}}; width: 26px; height: 26px; stroke-width: 2.2"><path d="{{i.back}}"></path></svg>
<svg class="i" viewBox="0 0 24 24" style="position: absolute; right: 34px; bottom: 28px; color: {{c.a}}; width: 26px; height: 26px; stroke-width: 2.2"><path d="{{i.forward}}"></path></svg>
<svg class="i" viewBox="0 0 24 24" style="position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); color: {{c.a}}; width: 26px; height: 26px; stroke-width: 2.2"><path d="{{i.up}}"></path></svg>
</div>
<div class="group">
<sc-for list="{{g}}" as="r" hint-placeholder-count="4">
<div class="row" style="min-height: 62px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">{{r.t}}</span><span class="t-sub">{{r.s}}</span></span><span class="sw on" style="background: {{c.a}}"><span></span></span></div>
</sc-for>
</div>
<div class="group">
<a href="#" class="row"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span class="t-label" style="font-size: 15px">Закрывать неактивные вкладки</span><span class="t-sub">Через 14 дней без открытия</span></span><svg class="i s" viewBox="0 0 24 24" style="color: var(--muted)"><path d="{{i.chevR}}"></path></svg></a>
<div class="row"><span style="flex-grow: 1" class="t-label">Обзор вкладок</span><span style="display: flex; gap: 4px"><span style="width: 44px; height: 36px; border-radius: 18px 8px 8px 18px; background: {{c.a}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.grid}}"></path></svg></span><span style="width: 44px; height: 36px; border-radius: 8px 18px 18px 8px; background: var(--s-high); display: flex; align-items: center; justify-content: center; color: var(--on-var)"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.list}}"></path></svg></span></span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
return {
i: window.VI || {},
c: window.VA ? window.VA(accent) : { a: accent },
g: [
{ t: 'Свайп по панели — соседняя вкладка', s: 'Влево и вправо по адресной панели' },
{ t: 'Свайп вверх — обзор вкладок', s: 'Вверх от адресной панели' },
{ t: 'Прятать панель при прокрутке', s: 'Остаётся капсула с адресом' },
{ t: 'Тактильная отдача', s: 'Лёгкий отклик на жестах' }
]
};
}
}
</script>
</body>
</html>
