<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — голосовой поиск</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: -120px; top: 260px; width: 630px; height: 630px; border-radius: 50%; background: radial-gradient(closest-side, {{c.a30}}, rgba(243,238,247,0))"></div>
<div style="position: relative; padding: 44px 16px 0; display: flex; align-items: center; justify-content: space-between">
<button class="ib" aria-label="Отмена"><svg class="i" viewBox="0 0 24 24"><path d="{{i.close}}"></path></svg></button>
<button style="height: 40px; border-radius: 20px; padding: 0 14px; background: var(--surface); box-shadow: var(--shadow-sm); font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px"><svg class="i xs" viewBox="0 0 24 24"><path d="{{i.globe}}"></path></svg>Русский<svg class="i xs" viewBox="0 0 24 24"><path d="{{i.chevD}}"></path></svg></button>
</div>
<div style="position: relative; padding: 120px 28px 0; display: flex; flex-direction: column; gap: 12px">
<span class="t-sub" style="font-size: 15px; font-weight: 700">Говорите…</span>
<p style="font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em">погода на Байкале в феврале <span style="color: var(--muted)">и толщина</span></p>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 214px; height: 72px; display: flex; align-items: center; justify-content: center; gap: 6px" aria-hidden="true">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="15"><span style="width: 6px; height: {{b}}; border-radius: 3px; background: {{c.a}}"></span></sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 60px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<button aria-label="Остановить запись" style="width: 84px; height: 84px; border-radius: 30px; background: {{c.a}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px {{c.a14}}, 0 14px 30px {{c.a45}}"><svg class="i l" viewBox="0 0 24 24"><path d="{{i.mic}}"></path></svg></button>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--on-var)"><svg class="i xs" viewBox="0 0 24 24"><path d="{{i.shieldCheck}}"></path></svg>Распознаётся на телефоне, запись не сохраняется</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E4EB7","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E4EB7';
return {
i: window.VI || {},
c: window.VA ? window.VA(accent) : { a: accent, a14: accent, a30: accent, a45: accent },
bars: ['10px', '18px', '30px', '44px', '26px', '52px', '64px', '40px', '58px', '34px', '22px', '38px', '16px', '24px', '10px']
};
}
}
</script>
</body>
</html>
