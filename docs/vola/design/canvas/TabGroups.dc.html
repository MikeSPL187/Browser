<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Vola — группы вкладок</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./vola.css">
<script src="./vola-icons.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E4EE}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="vl" style="width: 390px; height: 844px; background: var(--bg)">
<div style="position: absolute; left: -140px; top: -210px; width: 640px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, {{c.a30}}, rgba(243,238,247,0))"></div>
<div style="position: absolute; right: -200px; top: 180px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(closest-side, rgba(94,78,183,0.12), rgba(243,238,247,0))"></div>
<div style="position: relative; padding: 50px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 6px">
<div role="tablist" aria-label="Пространства" style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 28px; background: rgba(255,255,255,0.6)">
<button role="tab" aria-selected="false" aria-label="Личное" style="width: 44px; height: 44px; border-radius: 22px; color: #5E4EB7; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.home}}"></path></svg></button>
<button role="tab" aria-selected="true" style="height: 44px; border-radius: 16px; background: {{c.a}}; color: #FFFFFF; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; box-shadow: 0 6px 16px {{c.a30}}"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.work}}"></path></svg>Работа</button>
<button role="tab" aria-selected="false" aria-label="Аниме" style="width: 44px; height: 44px; border-radius: 22px; color: #A23F2B; display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.movie}}"></path></svg></button>
<button aria-label="Новое пространство" style="width: 44px; height: 44px; border-radius: 22px; color: var(--muted); display: flex; align-items: center; justify-content: center"><svg class="i s" viewBox="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
</div>
<span style="flex-grow: 1"></span>
<button class="ib" aria-label="Найти вкладку" style="background: rgba(255,255,255,0.6)"><svg class="i" viewBox="0 0 24 24"><path d="{{i.search}}"></path></svg></button>
</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 4px 4px 0">
<span class="t-h2">Вкладки</span>
<span class="t-sub" style="font-weight: 700">2 группы · 9 вкладок</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<a href="#" aria-label="Группа {{g.name}}, {{g.count}} вкладки" style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 196px; border-radius: 24px; background: {{g.tint}}; box-shadow: inset 0 0 0 2px {{g.color}}; padding: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{g.thumbs}}" as="th" hint-placeholder-count="4">
<div style="border-radius: 14px; background: {{th.card}}; padding: 7px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; box-shadow: 0 1px 3px rgba(38,22,86,0.08)"><span style="display: flex; align-items: center; gap: 4px"><i style="width: 8px; height: 8px; border-radius: 3px; background: {{th.brand}}"></i><i style="height: 4px; width: 50%; border-radius: 2px; background: var(--s-high)"></i></span><div style="flex-grow: 1; border-radius: 7px; background: {{th.tone}}"></div><i style="height: 4px; width: 80%; border-radius: 2px; background: var(--s-high)"></i></div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{g.color}}; flex-shrink: 0"></span>
<span style="font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1">{{g.name}}</span>
<span style="font-size: 12px; font-weight: 800; color: var(--muted)">{{g.count}}</span>
</div>
</a>
</sc-for>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 196px; border-radius: 24px; background: var(--surface); box-shadow: {{t.ring}}; overflow: hidden; position: relative; padding: 12px; display: flex; flex-direction: column; gap: 6px">
<div class="mp-head"><i style="background: {{t.brand}}"></i><span class="mp-l" style="width: 44%"></span></div>
<sc-if value="{{t.doc}}">
<span class="mp-t" style="width: 86%; margin-top: 4px"></span>
<span class="mp-t" style="width: 58%"></span>
<span class="mp-l" style="width: 96%; margin-top: 2px"></span>
<span class="mp-l" style="width: 90%"></span>
<span class="mp-l" style="width: 72%"></span>
<span style="display: flex; align-items: center; gap: 6px; margin-top: 2px"><i style="width: 10px; height: 10px; border-radius: 3px; background: {{t.brand}}"></i><span class="mp-l" style="width: 64%"></span></span>
<span style="display: flex; align-items: center; gap: 6px"><i style="width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--outline-var)"></i><span class="mp-l" style="width: 52%"></span></span>
<span style="display: flex; align-items: center; gap: 6px"><i style="width: 10px; height: 10px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--outline-var)"></i><span class="mp-l" style="width: 58%"></span></span>
<span style="border-radius: 9px; background: {{t.tone}}; padding: 8px; display: flex; flex-direction: column; gap: 5px; margin-top: 4px"><span class="mp-l" style="width: 80%; height: 5px; background: rgba(0,0,0,0.10)"></span><span class="mp-l" style="width: 56%; height: 5px; background: rgba(0,0,0,0.10)"></span></span>
</sc-if>
<sc-if value="{{t.board}}">
<span class="mp-t" style="width: 54%; margin-top: 4px"></span>
<span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 4px">
<span style="display: flex; flex-direction: column; gap: 5px"><span class="mp-l" style="height: 5px; width: 70%"></span><i style="height: 38px; border-radius: 8px; background: #FFE1D6"></i><i style="height: 26px; border-radius: 8px; background: #FFE1D6"></i><i style="height: 32px; border-radius: 8px; background: #FFE1D6"></i></span>
<span style="display: flex; flex-direction: column; gap: 5px"><span class="mp-l" style="height: 5px; width: 60%"></span><i style="height: 30px; border-radius: 8px; background: #E6DEFF"></i><i style="height: 44px; border-radius: 8px; background: #E6DEFF"></i></span>
<span style="display: flex; flex-direction: column; gap: 5px"><span class="mp-l" style="height: 5px; width: 76%"></span><i style="height: 24px; border-radius: 8px; background: #D4F1EC"></i><i style="height: 30px; border-radius: 8px; background: #D4F1EC"></i><i style="height: 20px; border-radius: 8px; background: #D4F1EC"></i></span>
</span>
</sc-if>
<sc-if value="{{t.chart}}">
<span style="display: flex; gap: 6px; margin-top: 4px">
<span style="flex: 1 1 0; border-radius: 9px; background: {{t.tone}}; padding: 7px; display: flex; flex-direction: column; gap: 5px"><span class="mp-l" style="width: 64%; height: 4px; background: rgba(0,0,0,0.10)"></span><i style="height: 11px; width: 72%; border-radius: 3px; background: {{t.brand}}"></i></span>
<span style="flex: 1 1 0; border-radius: 9px; background: var(--s-low); padding: 7px; display: flex; flex-direction: column; gap: 5px"><span class="mp-l" style="width: 56%; height: 4px"></span><i style="height: 11px; width: 58%; border-radius: 3px; background: var(--on); opacity: 0.6"></i></span>
</span>
<span style="height: 76px; display: flex; align-items: flex-end; gap: 6px; padding: 0 2px; border-bottom: 1.5px solid var(--s-high); margin-top: 4px">
<i style="flex: 1 1 0; height: 34%; border-radius: 3px 3px 0 0; background: {{t.tone}}"></i><i style="flex: 1 1 0; height: 48%; border-radius: 3px 3px 0 0; background: {{t.tone}}"></i><i style="flex: 1 1 0; height: 40%; border-radius: 3px 3px 0 0; background: {{t.tone}}"></i><i style="flex: 1 1 0; height: 62%; border-radius: 3px 3px 0 0; background: {{t.tone}}"></i><i style="flex: 1 1 0; height: 55%; border-radius: 3px 3px 0 0; background: {{t.tone}}"></i><i style="flex: 1 1 0; height: 82%; border-radius: 3px 3px 0 0; background: {{t.brand}}"></i><i style="flex: 1 1 0; height: 72%; border-radius: 3px 3px 0 0; background: {{t.tone}}"></i>
</span>
<span class="mp-l" style="width: 80%; margin-top: 2px"></span>
</sc-if>
<sc-if value="{{t.design}}">
<span style="flex-grow: 1; border-radius: 12px; background: var(--s-low); display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px">
<span style="width: 50px; height: 100px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--s-highest); display: flex; flex-direction: column; gap: 4px; padding: 6px"><i style="height: 22px; border-radius: 5px; background: {{t.tone}}"></i><span class="mp-l" style="height: 4px"></span><span class="mp-l" style="height: 4px; width: 70%"></span><span class="mp-l" style="height: 4px; width: 84%"></span><i style="margin-top: auto; height: 11px; border-radius: 6px; background: var(--s-high)"></i></span>
<span style="width: 50px; height: 100px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 2px {{t.brand}}; display: flex; flex-direction: column; gap: 4px; padding: 6px"><span style="display: grid; grid-template-columns: 1fr 1fr; gap: 3px"><i style="height: 14px; border-radius: 4px; background: {{t.tone}}"></i><i style="height: 14px; border-radius: 4px; background: #E6DEFF"></i><i style="height: 14px; border-radius: 4px; background: #D4F1EC"></i><i style="height: 14px; border-radius: 4px; background: #FFE9B8"></i></span><span class="mp-l" style="height: 4px"></span><i style="margin-top: auto; height: 11px; border-radius: 6px; background: {{t.brand}}"></i></span>
</span>
</sc-if>
<button aria-label="Закрыть вкладку" style="position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.9); box-shadow: var(--shadow-sm); color: var(--on-var); display: flex; align-items: center; justify-content: center"><svg class="i xs" viewBox="0 0 24 24"><path d="{{i.close}}"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
<span class="mono" style="width: 18px; height: 18px; border-radius: 6px; background: {{t.brand}}; color: #FFFFFF; font-size: 10px">{{t.l}}</span>
<span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span>
</div>
</div>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 104px; border-radius: 20px; background: #2E2B35; color: #F4EFF7; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); z-index: 2">
<svg class="i s" viewBox="0 0 24 24" style="color: #C9BFFF"><path d="{{i.stack}}"></path></svg>
<span style="flex-grow: 1; font-size: 13px; font-weight: 700; line-height: 1.35">3 вкладки про ремонт — собрать в группу?</span>
<button style="height: 40px; border-radius: 20px; padding: 0 12px; color: #C9BFFF; font-size: 14px; font-weight: 800">Собрать</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(180deg, rgba(243,238,247,0) 0%, rgba(243,238,247,0.95) 55%)"></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 10px">
<div class="glass" style="flex-grow: 1; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
<button class="ib" aria-label="Приватные вкладки"><svg class="i" viewBox="0 0 24 24"><path d="{{i.incognito}}"></path></svg></button>
<button class="ib" aria-label="Вид: сетка" style="background: {{c.a10}}; color: {{c.a}}"><svg class="i" viewBox="0 0 24 24"><path d="{{i.grid}}"></path></svg></button>
<button class="ib" aria-label="Недавно закрытые"><svg class="i" viewBox="0 0 24 24"><path d="{{i.undo}}"></path></svg></button>
<button class="ib" aria-label="Ещё"><svg class="i" viewBox="0 0 24 24"><path d="{{i.more}}"></path></svg></button>
</div>
<button aria-label="Новая вкладка" style="width: 64px; height: 64px; border-radius: 22px; background: {{c.a}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px {{c.a45}}"><svg class="i l" viewBox="0 0 24 24"><path d="{{i.plus}}"></path></svg></button>
</div>
<div class="stat" aria-hidden="true"><span>12:30</span><span class="ic"><svg viewBox="0 0 16 16"><path d="M15 1.5v13H1.5z"></path></svg><svg viewBox="0 0 16 16"><path d="M8 14.2L.6 5.3a11.6 11.6 0 0 1 14.8 0z"></path></svg><svg class="bat" viewBox="0 0 26 16"><rect x="1" y="3.5" width="20" height="9" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"></rect><rect x="2.9" y="5.4" width="13" height="5.2" rx="1.6"></rect><rect x="22.3" y="6.3" width="2" height="3.4" rx="1"></rect></svg></span></div>
<div class="navh" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#006877","options":["#5E4EB7","#006877","#A23F2B","#2F5BD3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#006877';
const c = window.VA ? window.VA(accent) : { a: accent };
return {
i: window.VI || {},
c: c,
groups: [
{ name: 'Поездка на Байкал', count: '4', color: '#2F5BD3', tint: '#E4EAFF', thumbs: [{ brand: '#2F6B5F', tone: '#CFE3EA', card: 'var(--surface)' }, { brand: '#1E5E8C', tone: '#D8EEFF', card: 'var(--surface)' }, { brand: '#9A3A1E', tone: '#FFE1D6', card: 'var(--surface)' }, { brand: '#6E4F00', tone: '#FFEBC2', card: 'var(--surface)' }] },
{ name: 'Спринт 42', count: '3', color: '#A23F2B', tint: '#FCE6DF', thumbs: [{ brand: '#9A3A1E', tone: '#FFE1D6', card: 'var(--surface)' }, { brand: '#4A3A9E', tone: '#E6DEFF', card: 'var(--surface)' }, { brand: '#00665A', tone: '#D4F1EC', card: 'var(--surface)' }, { brand: 'transparent', tone: 'transparent', card: 'rgba(255,255,255,0.35)' }] }
],
tabs: [
{ title: 'План запуска на октябрь', l: 'Д', brand: '#4A3A9E', tone: '#E6DEFF', doc: true, ring: '0 0 0 3px ' + accent + ', 0 8px 20px ' + c.a30 },
{ title: 'Макеты главного экрана', l: 'М', brand: '#962F59', tone: '#FFDDEA', design: true, ring: 'var(--shadow-sm)' }
]
};
}
}
</script>
</body>
</html>
