<!doctype html>
<!-- Keyboard probe for the emulator tour (scripts/ci/page_probe.py): a sign-in form low on the
     page, like the forms where the address capsule covered the fields. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form probe</title>
<style>
  html, body { margin: 0; padding: 0; background: rgb(250, 250, 250); font: 18px sans-serif; }
  .spacer { height: 55vh; }
  label, input, button { display: block; box-sizing: border-box; width: calc(100% - 32px);
                         margin: 8px 16px; font: 18px sans-serif; }
  input { height: 48px; padding: 0 12px; }
  button { height: 52px; }
</style>
</head>
<body>
<div class="spacer"></div>
<form onsubmit="return false">
  <label for="login">Login</label>
  <input id="login" name="username" autocomplete="username" placeholder="Probe login">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password"
         placeholder="Probe password">
  <button type="submit">Probe sign in</button>
</form>
<div class="spacer"></div>
</body>
</html>
